<script>window.ML_OFFLINE = true;</script>
<script>/* ============================================================
   Martelo Live — motor do jogo
   Roda igual no servidor (Node) e no navegador (modo local).
   Todo o estado é um objeto simples (serializável em JSON).
   O tempo entra sempre como parâmetro `now` (ms), nunca é lido aqui dentro,
   para que servidor e cliente controlem os relógios.
   ============================================================ */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.Engine = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  const COLORS = ["#ff4f6d", "#ffd166", "#4be3b0", "#7aa7ff", "#ff8fd8", "#b48cff", "#ff9d5c", "#5ee0f0", "#d7f26b", "#f2f2f2"];
  const GROUP_TAG = "Indicados pelo grupo";
  const FORMATS = {
    classic: { name: "Aberto", short: "Aberto", desc: "Lances em turnos. Quem passa sai do lote." },
    sealed: { name: "Lance secreto", short: "Secreto", desc: "Todos lançam escondido ao mesmo tempo. Maior lance leva." },
    dutch: { name: "Relógio holandês", short: "Relógio", desc: "O preço cai a cada segundo. Quem apertar primeiro compra." }
  };
  const MAX_PLAYERS = 10;
  const MARKET_BONUS = [3, 2, 1]; // pontos por filme dos 3 gêneros mais disputados

  const DEFAULTS = {
    money: 20,
    maxFilms: 3,
    formats: ["classic"],   // mais de um = cada lote sorteia o formato
    market: false,          // Mercado de gêneros
    missions: false,        // Missões secretas
    turnSeconds: 20,        // tempo por vez no Aberto (0 = sem limite)
    sealedSeconds: 25,      // tempo do Lance secreto (0 = sem limite)
    dutchStepMs: 900,       // a cada quanto tempo o relógio cai R$ 1
    autoNextSeconds: 8      // passa para o próximo lote sozinho (0 = só o host)
  };

  /* ---------- utilidades ---------- */
  const int = (v, min, max, def) => {
    v = Math.floor(Number(v));
    if (!Number.isFinite(v)) return def;
    return Math.max(min, Math.min(max, v));
  };
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const shuffle = (arr, rng) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };
  const primaryGenre = (f) => ((f.g || []).filter((x) => x !== GROUP_TAG)[0]) || "Outros";
  const decade = (y) => (y ? Math.floor(+y / 10) * 10 : null);

  function cleanSettings(s, base) {
    const b = Object.assign({}, DEFAULTS, base || {});
    s = s || {};
    const formats = Array.isArray(s.formats) ? s.formats.filter((f) => FORMATS[f]) : b.formats;
    return {
      money: int(s.money ?? b.money, 1, 9999, DEFAULTS.money),
      maxFilms: int(s.maxFilms ?? b.maxFilms, 1, 50, DEFAULTS.maxFilms),
      formats: formats.length ? [...new Set(formats)] : ["classic"],
      market: !!(s.market ?? b.market),
      missions: !!(s.missions ?? b.missions),
      turnSeconds: int(s.turnSeconds ?? b.turnSeconds, 0, 300, DEFAULTS.turnSeconds),
      sealedSeconds: int(s.sealedSeconds ?? b.sealedSeconds, 0, 300, DEFAULTS.sealedSeconds),
      dutchStepMs: int(s.dutchStepMs ?? b.dutchStepMs, 300, 5000, DEFAULTS.dutchStepMs),
      autoNextSeconds: int(s.autoNextSeconds ?? b.autoNextSeconds, 0, 120, DEFAULTS.autoNextSeconds)
    };
  }

  /* ---------- criação e lobby ---------- */
  function create(settings) {
    return {
      phase: "lobby",          // lobby | playing | over
      settings: cleanSettings(settings),
      players: [],             // {id, name, color, money, donated, films[], connected, missions[]}
      lots: [], idx: 0, lot: null,
      results: [], log: [],
      voting: null, votes: {}, // votação da melhor coleção: null | "open" | "closed"; votes = {quem vota: em quem}
      seq: 0,                  // muda a cada alteração (para saber quando reenviar)
      nextColor: 0
    };
  }
  function addPlayer(st, id, name) {
    name = String(name || "").replace(/\s+/g, " ").trim().slice(0, 18);
    if (!name) return "Digite um nome para entrar.";
    if (st.phase !== "lobby") return "O leilão já começou. Você pode assistir.";
    if (st.players.length >= MAX_PLAYERS) return `A sala está cheia (máximo de ${MAX_PLAYERS} jogadores).`;
    if (st.players.some((p) => p.name.toLowerCase() === name.toLowerCase())) return "Já tem alguém com esse nome na sala.";
    st.players.push({ id, name, color: COLORS[st.nextColor++ % COLORS.length], money: 0, donated: 0, films: [], connected: true, missions: [] });
    st.seq++;
    return null;
  }
  function removePlayer(st, id) {
    if (st.phase !== "lobby") return "Só dá para remover jogadores antes do leilão começar.";
    const n = st.players.length;
    st.players = st.players.filter((p) => p.id !== id);
    if (st.players.length !== n) st.seq++;
    return null;
  }
  function setConnected(st, id, on) {
    const p = st.players.find((x) => x.id === id);
    if (p && p.connected !== on) { p.connected = on; st.seq++; }
  }
  /* ---------- doação na sala (sai do dinheiro inicial; guarda R$ 1 para jogar) ---------- */
  const donateLeft = (st, p) => Math.max(0, st.settings.money - (p.donated || 0) - 1);
  function donate(st, id, amount) {
    if (st.phase !== "lobby") return "Doações só valem na sala, antes do leilão começar.";
    const p = st.players.find((x) => x.id === id);
    if (!p) return "Só jogadores podem doar.";
    const v = Math.floor(+amount);
    if (!(v >= 1)) return "A doação mínima é R$ 1.";
    const left = donateLeft(st, p);
    if (v > left) return left > 0 ? `Você pode doar até R$ ${left} e ainda guardar R$ 1 para o leilão.` : "Você precisa guardar pelo menos R$ 1 para o leilão.";
    p.donated = (p.donated || 0) + v;
    st.seq++;
    return null;
  }
  function updateSettings(st, patch) {
    if (st.phase !== "lobby") return "As regras não mudam com o leilão em andamento.";
    st.settings = cleanSettings(patch, st.settings);
    st.seq++;
    return null;
  }

  /* ---------- missões secretas ---------- */
  function missionPool(st) {
    const s = st.settings, lots = st.lots, start = s.money;
    const genreCount = {};
    lots.forEach((f) => (f.g || []).filter((g) => g !== GROUP_TAG).forEach((g) => (genreCount[g] = (genreCount[g] || 0) + 1)));
    const pool = [];
    Object.entries(genreCount).filter(([, c]) => c >= 3).forEach(([g]) =>
      pool.push({ key: "genre:" + g, kind: "genre", genre: g, n: 2, pts: 5, text: `Tenha 2 filmes de ${g}` }));
    pool.push({ key: "saver", kind: "saver", min: Math.ceil(start * 0.4), pts: 4, text: `Termine com pelo menos R$ ${Math.ceil(start * 0.4)} sobrando` });
    pool.push({ key: "bargain", kind: "bargain", max: Math.max(1, Math.floor(start * 0.1)), pts: 3, text: `Arremate um filme por até R$ ${Math.max(1, Math.floor(start * 0.1))}` });
    pool.push({ key: "big", kind: "big", pts: 4, text: "Faça a compra mais cara do leilão" });
    if (lots.filter((f) => +f.year && +f.year < 1990).length >= 2) pool.push({ key: "old", kind: "old", pts: 3, text: "Tenha um filme lançado antes de 1990" });
    if (lots.filter((f) => +f.year >= 2015).length >= 2) pool.push({ key: "new", kind: "new", pts: 3, text: "Tenha um filme lançado de 2015 em diante" });
    if (lots.filter((f) => (f.r || 0) >= 8.5).length >= 2) pool.push({ key: "critic", kind: "critic", pts: 3, text: "Tenha um filme com nota 8,5 ou mais" });
    if (s.maxFilms <= lots.length && s.maxFilms >= 2) pool.push({ key: "full", kind: "full", pts: 4, text: `Complete seu limite de ${s.maxFilms} filmes` });
    if (s.maxFilms >= 2) pool.push({ key: "decade", kind: "decade", pts: 3, text: "Tenha 2 filmes da mesma década" });
    if (s.maxFilms >= 3) pool.push({ key: "variety", kind: "variety", pts: 4, text: "Tenha filmes de 3 gêneros principais diferentes" });
    return pool;
  }
  function checkMission(st, p, m) {
    const films = p.films;
    switch (m.kind) {
      case "genre": return films.filter((f) => (f.g || []).includes(m.genre)).length >= m.n;
      case "saver": return p.money >= m.min;
      case "bargain": return films.some((f) => f.paid <= m.max);
      case "big": {
        const top = Math.max(0, ...st.results.map((r) => r.price || 0));
        return top > 0 && films.some((f) => f.paid === top);
      }
      case "old": return films.some((f) => +f.year && +f.year < 1990);
      case "new": return films.some((f) => +f.year >= 2015);
      case "critic": return films.some((f) => (f.r || 0) >= 8.5);
      case "full": return films.length >= st.settings.maxFilms;
      case "decade": {
        const c = {}; films.forEach((f) => { const d = decade(f.year); if (d) c[d] = (c[d] || 0) + 1; });
        return Object.values(c).some((n) => n >= 2);
      }
      case "variety": return new Set(films.map(primaryGenre)).size >= 3;
    }
    return false;
  }

  /* ---------- início ---------- */
  function cleanFilm(f) {
    const str = (v, n) => String(v ?? "").slice(0, n);
    const img = typeof f.img === "string" && /^https:\/\/(upload\.wikimedia\.org|m\.media-amazon\.com)\//.test(f.img) ? f.img.slice(0, 600) : null;
    return {
      id: str(f.id, 24), title: str(f.title, 140) || "Sem título", orig: str(f.orig, 140), year: int(f.year, 0, 3000, 0) || "",
      dir: str(f.dir, 140), g: (Array.isArray(f.g) ? f.g : []).slice(0, 8).map((x) => str(x, 32)),
      r: Number.isFinite(+f.r) && f.r !== null && f.r !== "" ? Math.round(Math.max(0, Math.min(10, +f.r)) * 10) / 10 : null,
      rsrc: str(f.rsrc, 24), img, wiki: str(f.wiki, 200), by: str(f.by, 30)
    };
  }
  function start(st, lots, now, rng) {
    rng = rng || Math.random;
  st.clock = now;
    if (st.players.length < 2) return "O leilão precisa de pelo menos 2 jogadores.";
    if (!Array.isArray(lots) || !lots.length) return "Escolha pelo menos 1 filme para leiloar.";
    const seen = new Set();
    st.lots = lots.slice(0, 200).map(cleanFilm).filter((f) => f.id && !seen.has(f.id) && seen.add(f.id));
    if (!st.lots.length) return "Nenhum filme válido para leiloar.";
    const fm = st.settings.formats;
    st.lots.forEach((f, i) => (f.format = fm.length === 1 ? fm[0] : fm[Math.floor(rng() * fm.length)]));
    st.players.forEach((p) => { p.money = Math.max(1, st.settings.money - (p.donated || 0)); p.films = []; p.missions = []; });
    if (st.settings.missions) {
      const pool = missionPool(st);
      const order = shuffle(pool, rng);
      st.players.forEach((p, i) => { p.missions = [clone(order[i % order.length])]; });
    }
    st.phase = "playing"; st.idx = 0; st.results = []; st.log = []; st.starter = 0; st.voting = null; st.votes = {};
    startLot(st, now);
    st.seq++;
    return null;
  }

  const canPlay = (st, p) => p.money >= 1 && p.films.length < st.settings.maxFilms;
  const byId = (st, id) => st.players.find((p) => p.id === id);
  function log(st, entry) { entry.at = st.clock || 0; st.log.unshift(entry); if (st.log.length > 250) st.log.length = 250; }

  function startLot(st, now) {
    if (st.idx >= st.lots.length || !st.players.some((p) => canPlay(st, p))) return finish(st);
    const f = st.lots[st.idx], s = st.settings;
    const eligible = st.players.filter((p) => canPlay(st, p)).map((p) => p.id);
    const lot = { format: f.format, stage: "bid", eligible, startedAt: now };
    if (f.format === "classic") {
      Object.assign(lot, { high: 0, highBy: null, inLot: eligible.slice(), passed: [] });
      // quem abre gira a cada lote
      const n = st.players.length;
      let i = st.starter % n, k = 0;
      while (!eligible.includes(st.players[i].id) && k++ < n) i = (i + 1) % n;
      lot.turn = st.players[i].id;
      lot.deadline = s.turnSeconds ? now + s.turnSeconds * 1000 : null;
    } else if (f.format === "sealed") {
      Object.assign(lot, { bids: {}, deadline: s.sealedSeconds ? now + s.sealedSeconds * 1000 : null });
    } else {
      const top = Math.max(...eligible.map((id) => byId(st, id).money));
      Object.assign(lot, { price: top, startPrice: top, nextAt: now + s.dutchStepMs + 1200, step: s.dutchStepMs, floorHits: 0 });
    }
    st.lot = lot;
    log(st, { k: "lot", n: st.idx + 1, title: f.title, format: f.format });
    if (f.format === "classic") classicAutoSkip(st, now);
  }

  /* ---------- Aberto ---------- */
  function classicNext(st, now) {
    const lot = st.lot, ids = st.players.map((p) => p.id), n = ids.length;
    const cur = ids.indexOf(lot.turn);
    for (let k = 1; k <= n; k++) {
      const c = ids[(cur + k) % n];
      if (lot.inLot.includes(c) && c !== lot.highBy) {
        lot.turn = c;
        lot.deadline = st.settings.turnSeconds ? now + st.settings.turnSeconds * 1000 : null;
        return classicAutoSkip(st, now);
      }
    }
    closeLot(st, now);
  }
  function classicAutoSkip(st, now) {
    const lot = st.lot;
    if (!lot.inLot.length) return closeLot(st, now);
    if (lot.highBy && lot.inLot.every((i) => i === lot.highBy)) return closeLot(st, now);
    const p = byId(st, lot.turn);
    if (p.money <= lot.high) {
      lot.inLot = lot.inLot.filter((i) => i !== p.id);
      log(st, { k: "broke", p: p.id, v: lot.high });
      return classicNext(st, now);
    }
  }

  /* ---------- fechamento ---------- */
  function sell(st, pid, price, now, extra) {
    const f = st.lots[st.idx], p = byId(st, pid);
    p.money -= price;
    p.films.push(Object.assign({}, f, { paid: price, lot: st.idx + 1 }));
    st.results.push({ id: f.id, title: f.title, by: pid, price, format: f.format });
    st.lot.stage = "done";
    st.lot.result = Object.assign({ by: pid, price }, extra || {});
    log(st, { k: "sold", p: pid, v: price, title: f.title });
  }
  function unsold(st, now, extra) {
    const f = st.lots[st.idx];
    st.results.push({ id: f.id, title: f.title, by: null, price: 0, format: f.format });
    st.lot.stage = "done";
    st.lot.result = Object.assign({ by: null, price: 0 }, extra || {});
    log(st, { k: "unsold", title: f.title });
  }
  function afterClose(st, now) {
    st.lot.deadline = st.settings.autoNextSeconds ? now + st.settings.autoNextSeconds * 1000 : null;
  }
  function closeLot(st, now) {
    const lot = st.lot;
    if (lot.format === "classic") {
      if (lot.highBy) sell(st, lot.highBy, lot.high, now); else unsold(st, now);
    } else if (lot.format === "sealed") {
      const bids = Object.entries(lot.bids).filter(([, b]) => b.v > 0).map(([p, b]) => ({ p, v: b.v, t: b.t }));
      bids.sort((a, b) => b.v - a.v || a.t - b.t);
      const reveal = bids.map((b) => ({ p: b.p, v: b.v }));
      log(st, { k: "reveal", bids: reveal });
      if (bids.length) sell(st, bids[0].p, bids[0].v, now, { reveal, tie: bids[1] && bids[1].v === bids[0].v });
      else unsold(st, now, { reveal });
    } else {
      unsold(st, now);
    }
    afterClose(st, now);
  }

  /* ---------- ações ---------- */
  function act(st, pid, a, now) {
    if (st.phase !== "playing" || !st.lot) return "O leilão não está em andamento.";
    st.clock = now;
    const lot = st.lot, p = byId(st, pid);
    if (!p) return "Você não é um jogador desta sala.";
    if (lot.stage !== "bid") return "Este lote já foi fechado.";
    if (lot.format === "classic") {
      if (lot.turn !== pid) return "Ainda não é a sua vez.";
      if (a.type === "bid") {
        const v = Math.floor(+a.amount);
        if (!(v > lot.high)) return `O lance precisa ser maior que R$ ${lot.high}.`;
        if (v > p.money) return `Você só tem R$ ${p.money}.`;
        lot.high = v; lot.highBy = pid;
        log(st, { k: "bid", p: pid, v });
      } else if (a.type === "pass") {
        lot.inLot = lot.inLot.filter((i) => i !== pid); lot.passed.push(pid);
        log(st, { k: "pass", p: pid });
      } else return "Ação inválida neste formato.";
      classicNext(st, now);
    } else if (lot.format === "sealed") {
      if (a.type !== "sealed") return "Ação inválida neste formato.";
      if (!lot.eligible.includes(pid)) return "Você está aguardando o fim do leilão.";
      const v = Math.max(0, Math.floor(+a.amount || 0));
      if (v > p.money) return `Você só tem R$ ${p.money}.`;
      const first = !lot.bids[pid];
      lot.bids[pid] = { v, t: lot.bids[pid] && lot.bids[pid].v === v ? lot.bids[pid].t : now };
      if (first) log(st, { k: v ? "sealed" : "sealedPass", p: pid });
      if (lot.eligible.every((id) => lot.bids[id])) closeLot(st, now);
    } else {
      if (a.type !== "buy") return "Ação inválida neste formato.";
      if (!lot.eligible.includes(pid)) return "Você está aguardando o fim do leilão.";
      if (p.money < lot.price) return `O preço ainda está acima do seu saldo (R$ ${p.money}).`;
      sell(st, pid, lot.price, now, { dutch: true });
      afterClose(st, now);
    }
    st.seq++;
    return null;
  }
  function next(st, now) {
    if (st.phase !== "playing" || !st.lot || st.lot.stage !== "done") return "O lote atual ainda está em disputa.";
    st.clock = now;
    st.idx++; st.starter = (st.starter + 1) % st.players.length;
    startLot(st, now);
    st.seq++;
    return null;
  }
  function finish(st) {
    for (let i = st.idx; i < st.lots.length; i++) {
      const f = st.lots[i];
      if (!st.results.some((r) => r.id === f.id)) st.results.push({ id: f.id, title: f.title, by: null, price: 0, format: f.format, skipped: true });
    }
    if (st.idx < st.lots.length) log(st, { k: "nobody" });

  // correções manuais (public/market-films.js) por cima do que veio do Wikidata
  function applyOverrides(film, overrides) {

    return Object.assign({}, film, o.film || {}, { scores: Object.assign({}, film.scores, o.scores || {}) });
  }

  /* ---------- catálogo e cópias ---------- */
  const IMDB = /^tt\d{5,10}$/;
  const str = (v, n) => String(v == null ? "" : v).slice(0, n);
  function addFilm(eco, f, now, cfg) {
    cfg = cfg || CONFIG;
    if (!f || !IMDB.test(f.id)) return "Código do IMDb inválido.";
    if (eco.films[f.id]) return "Esse filme já está no Mercado.";
    const r = refRating(f.scores, cfg);
    if (!r) return `O filme precisa de pelo menos ${cfg.minScores} notas para entrar no Mercado.`;
    const scores = {};
    Object.keys(SOURCES).forEach((k) => { const v = scoreOf(f.scores, k); if (v != null) scores[k] = v; });
    const links = Math.max(0, Math.floor(+f.links || 0)), garimpo = links > 0 && links < cfg.garimpoBelowLinks;

    eco.films[f.id] = {
      id: f.id, title: str(f.title, 140) || "Sem título", orig: str(f.orig, 140), year: Math.floor(+f.year) || "", dir: str(f.dir, 140),
      g: (Array.isArray(f.g) ? f.g : []).slice(0, 8).map((x) => str(x, 32)), img, wiki: str(f.wiki, 200), links, series: str(f.series, 140),

  const ownerOk = (eco, who) => who === "house" || !!eco.users[who];
  // a cópia nasce com o próximo número da tiragem
  function mintCopy(eco, filmId, owner, now) {
    const f = eco.films[filmId];
    if (!f) return "Filme fora do Mercado.";
    if (f.minted >= f.supply) return `Todas as ${f.supply} cópias de ${f.title} já foram emitidas.`;
    if (!ownerOk(eco, owner)) return "Dono inválido.";

  // troca de dono; o dinheiro é movido à parte (na mesma mutação do servidor)
  function transferCopy(eco, copyId, to, price, kind, now) {
    const c = eco.copies[copyId];

    if (!ownerOk(eco, to)) return "Dono inválido.";
    if (to === c.owner) return "A cópia já é desse dono.";
    if (!(Number.isInteger(price) && price >= 0)) return "Preço inválido.";

  }
  const copyLabel = (eco, c) => `cópia ${c.serial}/${eco.films[c.film].supply}`;
  const filmCard = (f) => ({ id: f.id, title: f.title, orig: f.orig, year: f.year, dir: f.dir, g: f.g, img: f.img, wiki: f.wiki, series: f.series || "", scores: f.scores, ref: f.ref, spread: f.spread, unanimous: f.unanimous, garimpo: f.garimpo, rarity: f.rarity, supply: f.supply, minted: f.minted });
  const byRarity = (a, b) => rarityIndex(b.rarity) - rarityIndex(a.rarity) || b.ref - a.ref || a.title.localeCompare(b.title);

    return Object.values(eco.copies).filter((c) => c.owner === uid)
      .map((c) => ({ id: c.id, serial: c.serial, label: copyLabel(eco, c), history: c.history, film: filmCard(eco.films[c.film]),
        value: refValue(eco, c.film, null, now), buyback: buybackPrice(eco, c.film, null, now), listed: (activeFor(eco, c.id) || {}).id || null }))

    return Object.values(eco.films).map((f) => Object.assign(filmCard(f), { left: f.supply - f.minted, house: house[f.id] || 0, addedAt: f.addedAt || 0 })).sort(byRarity);
  }

  // tira do catálogo os filmes sem cópias e sem estreia aberta, menos os que devem ficar;

  /* ---------- valor de referência e recompra da Casa ---------- */

  function refValue(eco, filmId, cfg, now) {
    cfg = cfg || CONFIG;
    const f = eco.films[filmId];
    if (!f) return 0;
    const base = rarity(f.rarity, cfg).minBid * cfg.refValueFactor;
    const sales = [];
    Object.values(eco.copies).forEach((c) => { if (c.film === filmId) c.history.forEach((h) => { if (h.price > 0 && h.kind !== "mint" && h.kind !== "buyback") sales.push(h); }); });
    const last = sales.sort((a, b) => b.at - a.at).slice(0, cfg.refValueSales);
    const v = Math.round((base + last.reduce((a, h) => a + h.price, 0)) / (1 + last.length));
    return now != null && inSeason(eco, f, now, cfg) ? Math.round(v * cfg.seasonValueBoost) : v;
  }

  const monthKey = (now, cfg) => { const L = new Date(now + cfg.tzOffsetMin * 60e3); return `${L.getUTCFullYear()}-${String(L.getUTCMonth() + 1).padStart(2, "0")}`; };
  // sorteio fixo pelo mês (todo mundo vê o mesmo gênero); o admin pode trocar para testar

  function setSeason(eco, genre, now, cfg) {

    eco.house.season = genre ? { month: monthKey(now, cfg), genre } : null;
    eco.seq++;

  }

  /* ---------- pontuação da coleção e ranking ---------- */
  const decadeOf = (y) => (+y ? `anos ${Math.floor(+y / 10) * 10}` : "");
  function collectionScore(eco, uid, now, cfg) {
    cfg = cfg || CONFIG;
    const films = [...new Set(Object.values(eco.copies).filter((c) => c.owner === uid).map((c) => c.film))].map((id) => eco.films[id]).filter(Boolean);
    const base = Math.round(films.reduce((a, f) => a + f.ref, 0) * 10) / 10;
    const groups = { series: (f) => f.series, director: (f) => f.dir, decade: (f) => decadeOf(f.year), genre: (f) => (f.g || [])[0] };
    const bonuses = [];
    Object.entries(cfg.collectionBonuses).forEach(([kind, b]) => {
      const count = {};
      films.forEach((f) => { const k = groups[kind](f); if (k) count[k] = (count[k] || 0) + 1; });
      Object.entries(count).forEach(([label, n]) => { if (n >= b.n) bonuses.push({ kind, name: b.name, label, n, pts: b.pts }); });
    });

    return Object.values(eco.users).map((u) => Object.assign({ id: u.id, name: u.name }, collectionScore(eco, u.id, now, cfg)))
      .sort((a, b) => b.total - a.total || b.films - a.films || a.name.localeCompare(b.name));
  }

  // vitrine pública (tela inicial, sem login): só o que já é público dentro do Mercado
  function showcase(eco, now, cfg) {

      open: A.open, featured: A.players.filter((a) => a.status === "open" && a.featured).slice(0, 3), next: A.next,

  /* ---------- teto de cópias por raridade ---------- */
  // conta as cópias que a pessoa tem e os leilões em que ela está na frente (ou tem lance secreto)

    const cap = (cfg.rarityCaps || {})[rarityKey];
    if (!cap) return null;
    const owned = Object.values(eco.copies).filter((c) => c.owner === uid && eco.films[c.film].rarity === rarityKey).length;
    const pending = Object.values(eco.auctions).filter((a) => a.id !== exceptAid && a.status === "open" && a.rarity === rarityKey && (a.highBy === uid || (a.sealed || {})[uid])).length;

  // a Casa nunca paga mais que o lance mínimo da faixa: sem lucro em comprar barato e revender para ela

    cfg = cfg || CONFIG;

    if (!f) return 0;

    return Math.max(1, Math.min(Math.floor(refValue(eco, filmId, cfg, now) * cfg.buybackPct), Math.max(1, minBid - 1)));

  /* ---------- estreias: a Casa leiloa uma cópia por evento ---------- */
  // próximo horário do evento (dia, semana ou mês) depois de `now`, no fuso do config
  function nextEstreia(ev, now, cfg) {

    const at = (y, m, d) => Date.UTC(y, m, d, ev.hour || 0) - off;

    if (ev.every === "month") {
      t = at(L.getUTCFullYear(), L.getUTCMonth(), ev.day || 1);

  // sorteia um filme das faixas do evento que ainda tenha cópia para emitir ou cópia no estoque da Casa
  function pickLot(eco, bands, rng) {
    const busy = new Set(Object.values(eco.auctions).filter((a) => a.kind === "house" && a.status === "open").map((a) => a.film));
    const stock = {};
    Object.values(eco.copies).forEach((c) => { if (c.owner === "house") (stock[c.film] = stock[c.film] || []).push(c.id); });
    const cands = Object.values(eco.films).filter((f) => bands.includes(f.rarity) && !busy.has(f.id) && (f.minted < f.supply || stock[f.id]))
      .sort((a, b) => a.id.localeCompare(b.id));
    if (!cands.length) return null;
    const f = cands[Math.floor((rng || Math.random)() * cands.length)];
    return { film: f.id, copy: stock[f.id] ? stock[f.id].sort()[0] : null };
  }
  function openAuction(eco, ev, lot, now) {

  // abre as estreias que chegaram na hora e agenda as próximas; devolve os leilões abertos

    cfg = cfg || CONFIG;
    eco.house.next = eco.house.next || {};

    cfg.estreias.forEach((ev) => {
      if (!eco.house.next[ev.key]) { eco.house.next[ev.key] = nextEstreia(ev, now, cfg); eco.seq++; }

      const lot = pickLot(eco, ev.bands, rng);

  }
  // admin: visão de todas as contas para conferir carteiras e coleções
  function accountsView(eco) {
    return Object.values(eco.users).map((u) => ({ id: u.id, name: u.name, admin: u.admin, wallet: Object.assign({}, u.wallet),
      copies: collectionOf(eco, u.id).map((c) => ({ id: c.id, title: c.film.title, rarity: c.film.rarity, label: c.label })) }))
      .sort((a, b) => a.name.localeCompare(b.name));
  }
  /* ---------- leilões dos jogadores ---------- */
  const FORMATS = {
    open: { name: "Aberto", desc: "Lances à vista, sempre maiores. Lance no fim prorroga o relógio." },
    sealed: { name: "Lance secreto", desc: "Cada um dá um lance escondido (pode trocar até o fim). O maior leva e paga o próprio lance." },
    vickrey: { name: "Secreto de 2º preço", desc: "Lances escondidos. O maior leva, mas paga o valor do segundo maior lance." },
    dutch: { name: "Relógio holandês", desc: "O preço começa alto e cai até o mínimo. O primeiro a comprar leva." }
  };
  const isActive = (a) => a.status === "open" || a.status === "scheduled";
  const activeFor = (eco, copyId) => Object.values(eco.auctions).find((a) => isActive(a) && a.copy === copyId) || null;

  // anuncia uma cópia da coleção: cobra a taxa de abertura (e a de vitrine), trava a cópia até o fim
  function listCopy(eco, uid, o, now, cfg) {
    cfg = cfg || CONFIG;
    const u = eco.users[uid], c = eco.copies[o.copy];
    if (!u) return { error: "Conta não encontrada." };
    if (!c || c.owner !== uid) return { error: "Essa cópia não é sua." };
    if (activeFor(eco, c.id)) return { error: "Essa cópia já está anunciada." };
    if (!FORMATS[o.format] || !cfg.userFormats.includes(o.format)) return { error: "Formato inválido." };
    const minutes = Math.floor(+o.minutes);
    if (!cfg.userDurations.includes(minutes)) return { error: "Duração inválida." };
    const startsAt = o.startsAt ? Math.floor(+o.startsAt) : now;
    if (!(startsAt >= now - 5 * 60e3 && startsAt <= now + cfg.maxScheduleDays * DAY)) return { error: `O início precisa ser entre agora e daqui a ${cfg.maxScheduleDays} dias.` };
    const active = Object.values(eco.auctions).filter((a) => a.kind === "user" && isActive(a));
    if (active.length >= cfg.maxActiveUserAuctions) return { error: `O Mercado já tem ${cfg.maxActiveUserAuctions} leilões de jogadores anunciados. Espere um terminar.` };
    if (active.filter((a) => a.seller === uid).length >= cfg.maxActivePerUser) return { error: `Cada jogador pode ter até ${cfg.maxActivePerUser} leilões anunciados ao mesmo tempo.` };
    const f = eco.films[c.film], minBid = rarity(f.rarity, cfg).minBid;
    const reserve = o.reserve ? Math.floor(+o.reserve) : 0;
    if (!(reserve >= 0 && reserve <= cfg.dutchMaxStart)) return { error: "Preço de reserva inválido." };
    let startPrice = 0;
    if (o.format === "dutch") {
      startPrice = Math.floor(+o.startPrice);
      const floor = Math.max(minBid, reserve);
      if (!(startPrice > floor && startPrice <= cfg.dutchMaxStart)) return { error: `No relógio, o preço inicial precisa ser maior que ${money(floor)} e no máximo ${money(cfg.dutchMaxStart)}.` };
    }
    const free = freeFeature(f.rarity, cfg), featured = free || !!o.featured;
    const fee = listingCost(eco, c.id, featured, cfg);
    if (fee > u.wallet.free) return { error: `Anunciar custa ${money(fee)} e você tem ${money(u.wallet.free)} livres.` };
    const ref = `${f.title} (${copyLabel(eco, c)})`;
    if (cfg.listingFee > 0) debit(eco, uid, cfg.listingFee, "fee", now, "anúncio: " + ref);
    if (fee > cfg.listingFee) debit(eco, uid, fee - cfg.listingFee, "fee", now, "vitrine: " + ref);
    const st = Math.max(startsAt, now);

    const id = "a" + eco.auctionSeq;
    eco.auctions[id] = { id, kind: "user", seller: uid, format: o.format, film: f.id, copy: c.id, rarity: f.rarity, minBid, reserve, startPrice, featured,
      startsAt: st, endsAt: st + minutes * 60e3, high: 0, highBy: null, bids: [], sealed: {}, extended: 0, status: st > now ? "scheduled" : "open", result: null, createdAt: now };

  }
  // o dono desiste: só antes de ter lance (a taxa de anúncio não volta)
  function unlist(eco, uid, aid, now) {
    const a = eco.auctions[aid];
    if (!a || a.kind !== "user" || a.seller !== uid) return "Esse anúncio não é seu.";
    if (!isActive(a)) return "Esse leilão já terminou.";

  }
  // relógio holandês: cai em linha reta do preço inicial até o mínimo (lance mínimo da raridade ou o que o dono pediu)

 ["tt4633694","Homem-Aranha no Aranhaverso","Spider-Man: Into the Spider-Verse",2018,"Persichetti, Ramsey e Rothman","Animação|Ação|Aventura",8.4,"Spider-Man: Into the Spider-Verse"],

 ["tt0317248","Cidade de Deus","Cidade de Deus",2002,"Fernando Meirelles","Nacional|Crime|Drama",8.6,"City of God (2002 film)"],
 ["tt0861739","Tropa de Elite","Tropa de Elite",2007,"José Padilha","Nacional|Ação|Crime",8.0,"Elite Squad"],
 ["tt0271383","O Auto da Compadecida","O Auto da Compadecida",2000,"Guel Arraes","Nacional|Comédia|Fantasia",8.5,"A Dog's Will"],
 ["tt0140888","Central do Brasil","Central do Brasil",1998,"Walter Salles","Nacional|Drama",8.0,"Central Station (film)"],

];
const BASE = RAW.map(([id, title, orig, year, dir, g, r, wiki, by]) => ({ id, title, orig, year, dir, g: g.split("|").concat(by ? [GROUP_TAG] : []), r, rsrc: "IMDb", wiki, by }));

const WD = "https://query.wikidata.org/sparql";
const IMDB = "https://api.imdbapi.dev";
const TIERS = {

const CATS = [

  Q842256: ["Musical"], Q1535153: ["Super-herói", "Ação"], Q202866: ["Animação"], Q29168811: ["Animação"], Q859369: ["Comédia", "Drama"],
  Q860626: ["Romance", "Comédia"], Q2973181: ["Ação", "Suspense"], Q853630: ["Suspense"], Q2421031: ["Crime", "Suspense"], Q20656232: ["Ficção científica", "Ação"], Q24925: ["Ficção científica"] };

  Romance: "Romance", Animation: "Animação", Crime: "Crime", Fantasy: "Fantasia", Adventure: "Aventura", Mystery: "Mistério", War: "Guerra", Western: "Faroeste", Musical: "Musical" };

/* ---------- cache local ---------- */
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },

};
const meta = store.get("ml-meta") || {};   // por IMDb id: {img, rating, plot, wdScore, syn, ...}
let saveTimer = null;
const saveMeta = () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => store.set("ml-meta", meta), 300); };
const listeners = new Set();
let notifyTimer = null;
const notify = () => { clearTimeout(notifyTimer); notifyTimer = setTimeout(() => listeners.forEach((fn) => fn()), 50); };
const status = { wikidata: "idle", posters: "idle", imdb: "idle" };

/* ---------- rede ---------- */
async function getJSON(url, ms = 10000) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error("HTTP " + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
const sparql = (q, ms = 60000) => getJSON(WD + "?format=json&query=" + encodeURIComponent(q), ms);
const qidOf = (uri) => uri.split("/").pop();
const wikiTitle = (url) => decodeURIComponent(url.split("/wiki/")[1] || "").replace(/_/g, " ");
const ptGenre = (g) => EN_PT[g] || g;

/* ---------- notas ---------- */
function ratingInfo(f) {
  const m = meta[f.id] || {};
  if (m.rating != null) return { v: +m.rating, src: "IMDb" };
  if (f.r != null && f.r !== "") return { v: +f.r, src: f.rsrc || "IMDb" };
  if (m.wdScore) return m.wdScore;
  return null;
}
const ratingOf = (f) => { const r = ratingInfo(f); return r ? Math.round(r.v * 10) / 10 : null; };
const SCORE_SRC = { Q37312: "IMDb", Q150248: "Metacritic", Q105584: "Rotten Tomatoes" };
const SCORE_PRI = ["IMDb", "Metacritic", "Rotten Tomatoes"];
function parseScore(txt) {
  const a = String(txt).match(/(\d+(?:[.,]\d+)?)\s*\/\s*(\d+)/);
  if (a) return parseFloat(a[1].replace(",", ".")) / parseFloat(a[2]) * 10;
  const p = String(txt).match(/(\d+(?:[.,]\d+)?)\s*%/);
  if (p) return parseFloat(p[1].replace(",", ".")) / 10;
  return null;
}
async function fetchScores(films) {
  const ids = [...new Set(films.filter((f) => !ratingInfo(f) && !(meta[f.id] && meta[f.id].wdTried)).map((f) => f.id))].filter((id) => /^tt\d+$/.test(id));
  for (let i = 0; i < ids.length; i += 80) {
    const part = ids.slice(i, i + 80);
    const q = `SELECT ?imdb ?by ?score WHERE {
      VALUES ?imdb { ${part.map((x) => '"' + x + '"').join(" ")} }
      VALUES ?by { wd:Q37312 wd:Q150248 wd:Q105584 }
      ?item wdt:P345 ?imdb . ?item p:P444 ?st . ?st ps:P444 ?score ; pq:P447 ?by . }`;
    try {
      const d = await sparql(q, 30000), best = {};
      d.results.bindings.forEach((b) => {
        const src = SCORE_SRC[qidOf(b.by.value)], v = parseScore(b.score.value), id = b.imdb.value;
        if (v == null || !src) return;
        const cur = best[id];
        if (!cur || SCORE_PRI.indexOf(src) < SCORE_PRI.indexOf(cur.src) || (src === cur.src && v > cur.v)) best[id] = { v, src };
      });
      part.forEach((id) => { meta[id] = Object.assign({}, meta[id], { wdTried: true }); if (best[id]) meta[id].wdScore = best[id]; });
      status.wikidata = "on";

  }

}
async function checkImdb() {
  status.imdb = "checking";
  try { absorbImdb(await getJSON(IMDB + "/titles/tt0102926", 7000)); status.imdb = "on"; }
  catch (e) { status.imdb = "off"; }
  notify();
}
function absorbImdb(t) {
  if (!t || !t.id) return;
  const m = meta[t.id] || {};
  meta[t.id] = Object.assign(m, { rating: t.rating?.aggregateRating ?? m.rating ?? null, plot: t.plot || m.plot || null, imdbImg: t.primaryImage?.url || m.imdbImg || null });
  if (!meta[t.id].img && meta[t.id].imdbImg) meta[t.id].img = meta[t.id].imdbImg;
}
async function enrichImdb(films) {
  if (status.imdb !== "on") return;
  const todo = films.filter((f) => !(meta[f.id] && meta[f.id].imdbDone));
  for (let i = 0; i < todo.length; i += 5) {
    await Promise.all(todo.slice(i, i + 5).map(async (f) => {
      try { absorbImdb(await getJSON(IMDB + "/titles/" + f.id, 7000)); meta[f.id].imdbDone = true; } catch (e) {}
    }));
    saveMeta(); notify();
  }
}
async function searchImdb(q) {
  const d = await getJSON(IMDB + "/search/titles?query=" + encodeURIComponent(q) + "&limit=10");
  return (d.titles || []).filter((t) => !t.type || /movie/i.test(t.type)).map((t) => {
    absorbImdb(t);
    return { id: t.id, title: t.primaryTitle, orig: t.originalTitle || t.primaryTitle, year: t.startYear || "", dir: "", g: (t.genres || []).map(ptGenre), r: t.rating?.aggregateRating ?? null, rsrc: "IMDb", wiki: null };
  });
}

/* ---------- pôsteres (Wikipédia) ---------- */
const posterQueue = new Map();
let posterTimer = null;
function wantPosters(films) {
  films.forEach((f) => { if (f.img && !(meta[f.id] && meta[f.id].img)) { meta[f.id] = Object.assign({}, meta[f.id], { img: f.img }); } if (f.wiki && !(meta[f.id] && (meta[f.id].wikiTried || meta[f.id].img))) posterQueue.set(f.id, f.wiki); });
  clearTimeout(posterTimer); posterTimer = setTimeout(flushPosters, 60);
}
async function flushPosters() {
  const items = [...posterQueue.entries()]; posterQueue.clear();
  for (let i = 0; i < items.length; i += 40) {
    const chunk = items.slice(i, i + 40);
    const url = "https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=500&pilicense=any&titles=" + encodeURIComponent(chunk.map((c) => c[1]).join("|"));
    try {
      const d = await getJSON(url), q = d.query || {}, map = {};
      (q.normalized || []).forEach((n) => (map[n.from] = n.to));
      (q.redirects || []).forEach((n) => (map[n.from] = n.to));
      const pages = Object.values(q.pages || {});
      chunk.forEach(([id, title]) => {
        let t = title, k = 0; while (map[t] && k++ < 3) t = map[t];
        const p = pages.find((x) => x.title === t);
        meta[id] = Object.assign({}, meta[id], { wikiTried: true });
        if (p && p.thumbnail && p.thumbnail.source && !meta[id].img) meta[id].img = p.thumbnail.source;

      status.posters = "on";
    } catch (e) { if (status.posters !== "on") status.posters = "off"; break; }

}
const posterOf = (f) => (meta[f.id] && meta[f.id].img) || f.img || null;

/* ---------- sorteio (Wikidata) ---------- */
const poolCache = {};
async function loadPool(cat, tierKey) {
  const tier = TIERS[tierKey] || TIERS.media;
  const min = !cat ? tier.min : cat.country ? Math.max(5, Math.round(tier.min * 0.25)) : Math.round(tier.min * 0.6);
  const key = "ml-pool-" + (cat ? cat.name : "all") + "-" + min;
  if (poolCache[key]) return poolCache[key];
  const cached = store.get(key);
  if (cached && Date.now() - cached.t < 7 * 864e5 && cached.rows.length) return (poolCache[key] = cached.rows);
  let link;
  if (!cat) link = "?item wdt:P31 wd:Q11424 .";
  else if (cat.country) link = `?item wdt:P495 wd:${cat.country} . ?item wdt:P31 wd:Q11424 .`;
  else if (cat.anim) link = "VALUES ?g { wd:Q202866 wd:Q29168811 } { ?item wdt:P136 ?g } UNION { ?item wdt:P31 ?g }";
  else link = `?item wdt:P136 wd:${cat.q} . ?item wdt:P31 wd:Q11424 .`;
  const d = await sparql(`SELECT ?item ?imdb ?article ?links WHERE {
    ${link}
    ?item wikibase:sitelinks ?links . FILTER(?links >= ${min})
    ?item wdt:P345 ?imdb .
    ?article schema:about ?item ; schema:isPartOf <https://en.wikipedia.org/> . }`);
  const seen = new Set(), rows = [];
  for (const b of d.results.bindings) {
    const qid = qidOf(b.item.value);
    if (seen.has(qid) || !/^tt\d+$/.test(b.imdb.value)) continue;
    seen.add(qid); rows.push([qid, b.imdb.value, wikiTitle(b.article.value), +b.links.value]);
  }
  poolCache[key] = rows; store.set(key, { t: Date.now(), rows });
  return rows;
}
async function hydrate(rows) {
  const out = [];
  for (let i = 0; i < rows.length; i += 60) {
    const part = rows.slice(i, i + 60);
    const d = await sparql(`SELECT ?item (SAMPLE(?pb) AS ?ptbr) (SAMPLE(?p) AS ?pt) (SAMPLE(?e) AS ?en) (SAMPLE(?dl) AS ?dir) (MIN(?y) AS ?year)
      (GROUP_CONCAT(DISTINCT STRAFTER(STR(?g),"entity/");separator="|") AS ?genres)
      (GROUP_CONCAT(DISTINCT STRAFTER(STR(?c),"entity/");separator="|") AS ?countries) WHERE {
      VALUES ?item { ${part.map((r) => "wd:" + r[0]).join(" ")} }
      OPTIONAL { ?item rdfs:label ?pb FILTER(LANG(?pb)="pt-br") }
      OPTIONAL { ?item rdfs:label ?p FILTER(LANG(?p)="pt") }
      OPTIONAL { ?item rdfs:label ?e FILTER(LANG(?e)="en") }
      OPTIONAL { ?item wdt:P57 ?d . ?d rdfs:label ?dl FILTER(LANG(?dl)="en") }
      OPTIONAL { ?item wdt:P577 ?date BIND(YEAR(?date) AS ?y) }
      OPTIONAL { ?item wdt:P136 ?g }
      OPTIONAL { ?item wdt:P495 ?c }
    } GROUP BY ?item`, 30000);
    const info = {}; d.results.bindings.forEach((b) => (info[qidOf(b.item.value)] = b));
    part.forEach(([qid, imdb, wiki, links]) => {
      const b = info[qid] || {}, v = (k) => b[k] && b[k].value;
      const en = v("en") || wiki, title = v("ptbr") || v("pt") || en;
      const g = [...new Set((v("genres") || "").split("|").flatMap((x) => QGENRE[x] || []))];
      if ((v("countries") || "").split("|").includes("Q155")) g.unshift("Nacional");
      out.push({ id: imdb, qid, title, orig: en, year: v("year") || "", dir: v("dir") || "", g, r: null, wiki, links });
    });
  }
  return out;
}
function sample(arr, n) {
  const a = arr.slice(), k = Math.min(n, a.length);
  for (let i = 0; i < k; i++) { const j = i + Math.floor(Math.random() * (a.length - i)); [a[i], a[j]] = [a[j], a[i]]; }
  return a.slice(0, k);
}
// opts: {mode:"random"|"genre", genres:[], tier, n}
async function draw(opts) {
  const n = Math.max(1, Math.min(200, opts.n | 0));
  let films = [], fellBack = false;
  try {
    if (opts.mode === "random") films = await hydrate(sample(await loadPool(null, opts.tier), n));
    else {
      const local = opts.genres.includes(GROUP_TAG) ? BASE.filter((f) => f.g.includes(GROUP_TAG)) : [];
      const online = CATS.filter((c) => opts.genres.includes(c.name));
      const pools = await Promise.all(online.map((c) => loadPool(c, opts.tier)));
      const merged = new Map(); pools.flat().forEach((r) => merged.set(r[0], r));
      const all = [...local.map((f) => ({ local: f })), ...[...merged.values()].map((r) => ({ row: r }))];
      const picked = sample(all, n);
      const hyd = await hydrate(picked.filter((x) => x.row).map((x) => x.row));
      films = sample([...picked.filter((x) => x.local).map((x) => ({ ...x.local })), ...hyd], picked.length);
    }
    status.wikidata = "on";
  } catch (e) {
    status.wikidata = "off"; fellBack = true;
    const base = opts.mode === "genre" ? BASE.filter((f) => f.g.some((g) => opts.genres.includes(g))) : BASE;
    films = sample(base, n).map((f) => ({ ...f }));
  }
  notify();
  wantPosters(films);
  fetchScores(films);
  enrichImdb(films);
  return { films, fellBack, short: films.length < n };
}
// Antes de começar: espera (até um limite) pôsteres e notas, e congela os dados de cada lote
async function finalize(films, maxWait = 9000) {
  wantPosters(films);
  await Promise.race([Promise.all([fetchScores(films), new Promise((r) => setTimeout(r, 1500))]), new Promise((r) => setTimeout(r, maxWait))]);
  return films.map((f) => {
    const ri = ratingInfo(f);
    return { id: f.id, title: f.title, orig: f.orig, year: f.year, dir: f.dir, g: f.g, r: ri ? Math.round(ri.v * 10) / 10 : null, rsrc: ri ? ri.src : "", img: posterOf(f), wiki: f.wiki, by: f.by || "" };
  });
}

/* ---------- sinopse (Wikipédia pt → en → IMDb) ---------- */
const PLOT_HEADS = /^(sinopse|enredo|trama|resumo|argumento|história|plot|synopsis|premise|plot summary)$/i;
const synBusy = new Set();
function cutText(t, max = 650) {
  t = t.replace(/\s+/g, " ").trim();
  if (t.length <= max) return t;
  const cut = t.slice(0, max), end = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf("! "), cut.lastIndexOf("? "));
  return end > 200 ? cut.slice(0, end + 1) : cut.replace(/\s\S*$/, "") + "…";
}
function splitPlot(txt) {
  const parts = txt.split(/\n(={2,})\s*(.+?)\s*\1\n/);
  const intro = (parts[0] || "").trim();
  let plot = null;
  for (let i = 1; i < parts.length; i += 3) if (PLOT_HEADS.test(parts[i + 1] || "") && (parts[i + 2] || "").trim()) { plot = parts[i + 2].trim(); break; }
  return { plot, intro };
}
async function wikiText(lang, title) {
  const d = await getJSON(`https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=extracts&explaintext=1&exsectionformat=wiki&titles=${encodeURIComponent(title)}`, 12000);
  const p = Object.values(d.query?.pages || {})[0];
  return p && p.extract ? splitPlot(p.extract) : null;
}
async function fetchSynopsis(f) {
  if (!f || synBusy.has(f.id) || (meta[f.id] && meta[f.id].syn)) return;
  synBusy.add(f.id); notify();
  let syn = null;
  try {
    let pt = null, en = f.wiki || null;
    try {
      const d = await sparql(`SELECT ?pt ?en WHERE { VALUES ?imdb {"${String(f.id).replace(/[^a-z0-9]/gi, "")}"} ?item wdt:P345 ?imdb .
        OPTIONAL { ?pt schema:about ?item ; schema:isPartOf <https://pt.wikipedia.org/> . }
        OPTIONAL { ?en schema:about ?item ; schema:isPartOf <https://en.wikipedia.org/> . } } LIMIT 1`, 15000);
      const b = d.results.bindings[0] || {};
      if (b.pt) pt = wikiTitle(b.pt.value);
      if (b.en && !en) en = wikiTitle(b.en.value);
    } catch (e) {}
    const [ptT, enT] = await Promise.all([pt ? wikiText("pt", pt).catch(() => null) : null, en ? wikiText("en", en).catch(() => null) : null]);
    if (ptT && ptT.plot) syn = { text: cutText(ptT.plot), src: "Wikipédia" };
    else if (enT && enT.plot) syn = { text: cutText(enT.plot), src: "Wikipedia em inglês" };
    else if (ptT && ptT.intro) syn = { text: cutText(ptT.intro), src: "Wikipédia" };
    else if (meta[f.id] && meta[f.id].plot) syn = { text: cutText(meta[f.id].plot), src: "IMDb em inglês" };
    else if (enT && enT.intro) syn = { text: cutText(enT.intro), src: "Wikipedia em inglês" };
  } catch (e) {}
  meta[f.id] = Object.assign({}, meta[f.id], { syn: syn || { text: "", src: "" } });
  synBusy.delete(f.id); saveMeta(); notify();
}
const synopsisOf = (f) => (meta[f.id] && meta[f.id].syn) || (synBusy.has(f.id) ? { loading: true } : null);

window.Catalog = { BASE, CATS, TIERS, GROUP_TAG, status, meta, store, onUpdate: (fn) => listeners.add(fn),
  draw, finalize, wantPosters, posterOf, ratingInfo, ratingOf, fetchScores, checkImdb, enrichImdb, searchImdb, fetchSynopsis, synopsisOf, sample };
})();

<script>/* Martelo Live — conexão com o servidor (WebSocket nativo, reconexão automática) */
(function () {

    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.t === "ack") { const w = waits.get(m.id); if (w) { waits.delete(m.id); w(m.d); } return; }
      emit(m.t, m.d);
    };
    ws.onclose = () => {
      waits.forEach((w) => w({ error: "A conexão caiu. Tentando reconectar…" })); waits.clear();
      if (Net.status === "on") emit("lost");
      Net.status = Date.now() - sentAt < 1500 && retry > 3 ? "unavailable" : "connecting";
      emit("status");
      schedule();
    };
    ws.onerror = () => {};
  }
  function schedule() {
    if (!wantOpen) return;
    retry++;
    timer = setTimeout(open, Math.min(8000, 600 * retry));
  }
  window.Net = Net;
})();
</script>

function statusPill(st, p) {

function logText(e) {
  const n = (id) => `<b>${esc(nameOf(id))}</b>`;
  switch (e.k) {
    case "lot": return ["lot", `Lote ${e.n} no ar: ${esc(e.title)} (${E.FORMATS[e.format].name})`];
    case "bid": return ["bid", `${n(e.p)} deu um lance de ${brl(e.v)}`];
    case "pass": return ["", `${n(e.p)} passou`];
    case "timeout": return ["", `${n(e.p)} não respondeu a tempo e passou`];
    case "broke": return ["", `${n(e.p)} não tem saldo para cobrir ${brl(e.v)}`];
    case "sealed": return ["bid", `${n(e.p)} enviou um lance secreto`];
    case "sealedPass": return ["", `${n(e.p)} não quis este lote`];
    case "reveal": return ["", e.bids.length ? `Lances revelados: ${e.bids.map((b) => `${esc(nameOf(b.p))} ${brl(b.v)}`).join(", ")}` : "Ninguém deu lance secreto"];
    case "sold": return ["sold", `Vendido! ${esc(e.title)} para ${n(e.p)} por ${brl(e.v)}`];
    case "unsold": return ["", `${esc(e.title)} ficou sem lances`];
    case "nobody": return ["", "Ninguém mais pode comprar. Fim do leilão."];
    case "end": return ["lot", "Fim da transmissão"];
  }
  return ["", ""];
}

// voto da galera: online o servidor só manda o meu voto e, depois de fechar, a contagem sem nomes
function voteBox(st, p, tally, fav) {
  const n = tally[p.id] || 0;
  if (st.voting !== "open") return `<div class="vote-line ${fav ? "fav" : ""}"><span>🗳️ Voto da galera</span><b class="num">${n} ${n === 1 ? "voto" : "votos"}</b></div>`;
  if (S.mode === "local") return "";
  if (p.id === S.you) return `<div class="vote-line"><span class="hint">Sua coleção. Não vale votar nela.</span></div>`;
  const mine = st.myVote === p.id;
  return `<button class="btn ${mine ? "mint" : ""}" data-vote="${p.id}" aria-pressed="${mine}">${mine ? "✓ Seu voto" : "Votar nesta coleção"}</button>`;
}
function localVotePanel(st) {
  if (S.mode !== "local" || st.voting !== "open") return "";
  const rows = st.players.map((v) => `<div class="voter"><span class="avatar sm" style="background:${v.color}">${initial(v.name)}</span><span class="nm">${esc(v.name)}</span>
    <div class="seg" role="group" aria-label="Voto de ${esc(v.name)}">${st.players.filter((p) => p.id !== v.id).map((p) => `<button type="button" data-vote="${p.id}" data-voter="${v.id}" aria-pressed="${st.votes[v.id] === p.id}">${esc(p.name)}</button>`).join("")}</div></div>`).join("");
  return panel("vote", "Votação da melhor coleção", `<div class="voters">${rows}</div>`, `<span class="hint">Ninguém vota em si mesmo</span>`);
}
function renderFinal() {
  const st = cur(), sc = E.scores(st), r = st.settings;
  const top = sc[0], winner = pl(top.id);
  const mk = r.market ? E.market(st) : [];
  const open = st.voting === "open", tally = E.voteTally(st);
  const total = S.mode === "online" ? st.voteTotal || 0 : Object.keys(st.votes || {}).length;
  const vw = open ? null : E.voteWinner(st), fan = vw && pl(vw.id);
  let crowd;

      <p class="num">Quem joga e quem assiste escolhe a melhor coleção. ${total} ${total === 1 ? "voto" : "votos"} até agora.${S.mode === "online" && !st.myVote ? " Vote nos cartões abaixo." : ""}</p>
      ${isHost() ? `<div class="toolbar"><button class="btn mint" data-act="close-vote">Encerrar votação</button></div>` : ""}</div></section>`;
  else if (fan) crowd = `<section class="champion crowd"><span class="avatar" style="background:${fan.color}">${initial(fan.name)}</span><div><span class="label">Voto da galera</span><h1>${esc(fan.name)} montou a melhor coleção</h1>
      <p class="num">${vw.votes} de ${total} ${total === 1 ? "voto" : "votos"}. Empate fica com quem somou mais nota.</p></div></section>`;
  else crowd = `<section class="champion crowd"><span class="avatar">🗳️</span><div><span class="label">Voto da galera</span><h1>Ninguém votou</h1><p>A votação foi encerrada sem votos.</p></div></section>`;
  const cards = sc.map((row, i) => {
    const p = pl(row.id);
    const cols = [["Notas", pts(row.ratings)]];
    if (r.market) cols.push(["Mercado", "+" + row.market]);
    if (r.missions) cols.push(["Missões", "+" + row.missionPts]);
    cols.push(["Total", pts(row.total)]);
    return `<article class="stand ${fan && fan.id === p.id ? "fav" : ""}" style="--pc:${p.color}">
      <div class="head"><span class="rank num">${i + 1}º</span><span class="avatar" style="background:${p.color}">${initial(p.name)}</span><h3>${esc(p.name)}</h3><span class="hint num">sobrou ${brl(p.money)}</span></div>
      <div class="breakdown" style="grid-template-columns:repeat(${cols.length},minmax(0,1fr))">${cols.map(([l, v], k) => `<div class="${k === cols.length - 1 ? "total" : ""}"><span>${l}</span><b class="num">${v}</b></div>`).join("")}</div>
      ${p.films.length ? `<div class="coll">${p.films.map((f) => { const ri = f.r != null ? { v: f.r, src: f.rsrc || "IMDb" } : null; return `<div class="item"><div style="width:40px">${zoomable(f)}</div><div class="t">${esc(f.title)}<small>${ri ? `★ ${pts(ri.v)} ${esc(ri.src)}` : "sem nota"}${f.year ? ` · ${esc(f.year)}` : ""}</small></div><span class="paid num">${brl(f.paid)}</span></div>`; }).join("")}</div>` : `<p class="empty">Não arrematou nenhum filme.</p>`}
      ${r.missions ? `<div class="mis-list">${row.missions.map((m) => `<div><span class="${m.ok ? "ok" : "no"}">${m.ok ? "✓" : "✗"}</span><span>${esc(m.text)} ${m.ok ? `(+${m.pts})` : ""}</span></div>`).join("")}</div>` : ""}
      ${voteBox(st, p, tally, fan && fan.id === p.id)}
    </article>`;
  }).join("");
  const unsold = st.results.filter((x) => !x.by);
  const actions = isHost()
    ? `<button class="btn go big" data-act="again">Nova rodada com a mesma galera</button><button class="btn quiet" data-act="leave">Sair</button>`
    : `<p class="hint">Aguardando ${esc(nameOf(S.host))} abrir outra rodada.</p><button class="btn quiet" data-act="leave">Sair</button>`;
  const main = `<div class="main final">
    <div class="champs">
      <section class="champion"><span class="avatar" style="background:${winner.color}">${initial(winner.name)}</span>
        <div><span class="label">Soma das notas</span><h1>${esc(winner.name)} venceu nas notas</h1><p class="num">${pts(top.total)} pontos com ${winner.films.length} ${winner.films.length === 1 ? "filme" : "filmes"}. Empate vai para quem guardou mais dinheiro.</p></div></section>
      ${crowd}
    </div>
    ${localVotePanel(st)}
    <div class="standings">${cards}</div>
    ${r.market && mk.length ? panel("market", "Bolsa de gêneros no fechamento", `<div class="ticker">${mk.map((m) => `<div class="tick ${m.bonus ? "hot" : ""}"><b>${esc(m.genre)}</b><span class="num">${m.count} ${m.count === 1 ? "filme" : "filmes"}</span>${m.bonus ? `<em>+${m.bonus} por filme</em>` : ""}</div>`).join("")}</div>`) : ""}
    ${unsold.length ? panel("unsold", "Ficaram sem dono", `<div class="chips" style="display:flex;flex-wrap:wrap;gap:6px">${unsold.map((x) => `<span class="chip">${esc(x.title)}</span>`).join("")}</div>`, `<span class="hint num">${unsold.length}</span>`) : ""}
    <div class="toolbar">${actions}</div>
  </div>`;
  return `<main class="wrap live">${main}${sidePanel()}</main>`;

/* ---------- Mercado: abas no topo e uma tela por assunto ---------- */

function miniAuction(a, mode) {

  const goto = mode === "join" ? `data-act="market-join" data-after="${user ? "leiloes" : "estreias"}"` : `data-mtab="${user ? "leiloes" : "estreias"}"`;
  return `<button type="button" class="mini r-${esc(f.rarity)}" ${goto}>

    <span class="mr"><span class="clock num" data-clock="${a.endsAt}"></span>${price}<span class="hint">${fmt === "dutch" ? "preço agora" : secret ? "secretos" : a.highBy ? (a.highBy === "house" ? "da Casa" : a.mine ? "seu lance" : "maior lance") : "lance mínimo"}</span></span>
  </button>`;
}
function liveNow(list, next, mode) {

/* ---------- relógios na tela (barra e segundos) ---------- */
function tickClocks() {
  const t = now();
  document.querySelectorAll(".fill[data-until]").forEach((el) => {
    const from = +el.dataset.from, until = +el.dataset.until;
    const total = Math.max(1, until - from);
    el.style.width = Math.max(0, Math.min(100, ((until - t) / total) * 100)) + "%";
  });
  document.querySelectorAll("span[data-until]").forEach((el) => { el.textContent = Math.max(0, Math.ceil((+el.dataset.until - t) / 1000)) + " s"; });
  // relógios longos (estreias do Mercado): h:mm:ss ou m:ss; nos últimos 30 s ficam vermelhos
  document.querySelectorAll("[data-clock]").forEach((el) => {
    const s = Math.max(0, Math.ceil((+el.dataset.clock - t) / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), p = (n) => String(n).padStart(2, "0");
    el.textContent = s ? (h >= 48 ? `${Math.floor(h / 24)} dias` : h ? `${h}:${p(m)}:${p(s % 60)}` : `${m}:${p(s % 60)}`) : "agora…";
    el.classList.toggle("hot", s <= MC.extendWindowSec);
  });
  // relógio holandês: o preço cai na tela com a mesma conta do servidor
  document.querySelectorAll("[data-dutch]").forEach((el) => {
    const [start, floor, from, until] = el.dataset.dutch.split("|").map(Number);
    el.textContent = mny(MK.dutchPrice({ startPrice: start, minBid: floor, reserve: 0, startsAt: from, endsAt: until }, t));
  });
}

// sons feitos na hora com Web Audio (sem arquivos); o navegador só libera depois do primeiro toque
const Sound = (() => {
  const AC = window.AudioContext || window.webkitAudioContext;
  let ctx = null, out = null, noiseBuf = null;
  function unlock() {
    if (!AC) return;
    try {
      if (!ctx) { ctx = new AC(); out = ctx.createGain(); out.gain.value = 0.5; out.connect(ctx.destination); }
      if (ctx.state === "suspended") ctx.resume();
    } catch (e) {}
  }
  function tone(f, t, len, type, vol, f2) {
    const o = ctx.createOscillator(), g = ctx.createGain();

    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + len);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g).connect(out); o.start(t); o.stop(t + len + 0.05);
  }
  function noise(t, len, vol, hp) {
    if (!noiseBuf) { noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; s.loop = true; f.type = "highpass"; f.frequency.value = hp;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    s.connect(f).connect(g).connect(out); s.start(t); s.stop(t + len + 0.05);
  }
  function donation(v) {
    if (!S.sound || !ctx || ctx.state !== "running") return;
    const t = ctx.currentTime + 0.03, n = Math.min(v, 15), P = [0, 2, 4, 7, 9];
    tone(988, t, 0.1, "square", 0.1); tone(1319, t + 0.08, 0.4, "square", 0.1);                   // moeda
    for (let i = 0; i < n; i++) tone(392 * 2 ** ((P[i % 5] + 12 * Math.floor(i / 5)) / 12), t + 0.3 + i * 0.06, 0.18, "triangle", 0.1); // uma nota por real
    let e = t + 0.3 + n * 0.06;
    if (v >= 5) tone(180, t, 0.6, "sine", 0.5, 40);                                                  // grave
    if (v >= 10) for (let k = 0; k < 3; k++) [349, 440, 523].forEach((f) => tone(f, e + k * 0.26, k === 2 ? 0.7 : 0.2, "sawtooth", 0.05)); // buzina
    if (v >= 20) { e += 1; tone(600, e, 0.7, "sawtooth", 0.04, 1300); tone(1300, e + 0.7, 0.7, "sawtooth", 0.04, 600); } // sirene
    if (v >= 30) { for (let k = 0; k < 20; k++) noise(t + 0.2 + k * 0.05, 0.05, 0.05 + k * 0.01, 800); noise(t + 1.25, 1.4, 0.35, 3000); } // rufar e prato
    if (v >= 50) [523, 659, 784, 1047].forEach((f, i) => tone(f, e + 1.6 + i * 0.12, 0.9 - i * 0.1, "square", 0.06)); // fanfarra
    if (v >= 100) [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, e + 2.3 + i * 0.1, 0.8, "square", 0.05));
  }

      <div class="sub"><span class="rate">${rate}</span>${f.paid ? `<span>Pago ${brl(f.paid)}</span>` : ""}</div>`;
    zoomKey = key;
  }
  zoomPop.hidden = false; zoomPop.style.display = "flex";
  const w = zoomPop.offsetWidth, h = zoomPop.offsetHeight, pad = 12;
  let left = x + 18, top = y - h / 2;
  if (left + w > innerWidth - pad) left = x - w - 18;
  zoomPop.style.left = Math.max(pad, Math.min(left, innerWidth - w - pad)) + "px";
  zoomPop.style.top = Math.max(pad, Math.min(top, innerHeight - h - pad)) + "px";
}
function hideZoom() { zoomPop.hidden = true; zoomPop.style.display = "none"; zoomKey = null; }
document.addEventListener("mousemove", (e) => { const z = e.target.closest && e.target.closest("[data-zoom]"); if (z) showZoom(z.dataset.zoom, e.clientX, e.clientY); else if (zoomKey) hideZoom(); });
document.addEventListener("focusin", (e) => { const z = e.target.closest && e.target.closest("[data-zoom]"); if (z) { const r = z.getBoundingClientRect(); showZoom(z.dataset.zoom, r.right, r.top + r.height / 2); } });
document.addEventListener("focusout", (e) => { if (e.target.closest && e.target.closest("[data-zoom]")) hideZoom(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { hideZoom(); if (S.ui.modal) { S.ui.modal = null; render(); } } });
addEventListener("scroll", hideZoom, { passive: true });

let drawTimer = null, drawSeq = 0;
const scheduleDraw = () => { clearTimeout(drawTimer); drawTimer = setTimeout(drawLots, 350); };
async function drawLots() {
  const s = S.setup; if (s.lotMode === "pick") return;
  if (s.lotMode === "genre" && !s.genres.length) { s.draw = []; saveSetup(); return render(); }
  const seq = ++drawSeq;
  S.ui.drawing = true; S.ui.drawMsg = ""; S.ui.showDraw = false; render();
  const res = await C.draw({ mode: s.lotMode, genres: s.genres, tier: s.tier, n: s.lots });
  if (seq !== drawSeq) return;
  s.draw = res.films; saveSetup();
  S.ui.drawing = false;
  S.ui.drawMsg = res.fellBack ? `Sem conexão com o Wikidata. Sorteei do catálogo embutido (${C.BASE.length} filmes).` : res.short ? `Só existem ${res.films.length} filmes com esse filtro e essa popularidade.` : "";
  render();
}
function pushLocalHistory() { S.history.push(JSON.stringify(S.local)); if (S.history.length > 80) S.history.shift(); }
async function doAct(type, amount, pid) {
  if (S.mode === "online") {
    const r = await N.call("game:act", { type, amount });
    if (r && r.error) toast(r.error, true);
    return;
  }
  const before = JSON.stringify(S.local);
  const err = E.act(S.local, pid, { type, amount }, Date.now());
  if (err) return toast(err, true);
  S.history.push(before); if (S.history.length > 80) S.history.shift();
  afterLocal();
}
function afterLocal() { processFx(); saveLocal(); render(); ensureSynopsis(); }
async function setRule(patch) {
  if (!isHost()) return;
  if (S.mode === "online") {
    S.st.settings = E.cleanSettings(patch, S.st.settings); render();
    const r = await N.call("room:settings", patch);
    if (r && r.error) toast(r.error, true);
  } else {
    S.rulesLocal = E.cleanSettings(patch, S.rulesLocal); store.set("ml-rules-local", S.rulesLocal); render();
  }
}
async function startGame() {
  S.ui.err = "";
  const src = lotsForStart();
  if (!src.length) { S.ui.err = S.setup.lotMode === "pick" ? "Escolha pelo menos um filme." : "Sorteie os filmes primeiro."; return render(); }
  if (S.mode === "local") {
    const names = S.setup.localPlayers.map((n) => n.trim()).filter(Boolean);
    const st = E.create(S.rulesLocal);
    for (let i = 0; i < names.length; i++) { const e = E.addPlayer(st, "L" + i, names[i]); if (e) { S.ui.err = e; return render(); } }
    S.ui.preparing = true; render();
    const lots = await C.finalize(src);
    S.ui.preparing = false;
    const e = E.start(st, lots, Date.now());
    if (e) { S.ui.err = e; return render(); }
    S.local = st; S.history = []; S.lastTop = st.log[0] ? JSON.stringify(st.log[0]) : null;
    saveLocal(); render(); ensureSynopsis();
    return;
  }
  S.ui.preparing = true; render();
  const lots = await C.finalize(src);
  const r = await N.call("game:start", { lots });
  S.ui.preparing = false;
  if (r && r.error) { S.ui.err = r.error; toast(r.error, true); }
  render();
}
function ensureSynopsis() {
  const st = cur();
  if (!st || st.phase !== "playing") return;
  const f = st.lots[st.idx]; C.fetchSynopsis(f);
  const nx = st.lots[st.idx + 1]; if (nx) setTimeout(() => C.fetchSynopsis(nx), 1500);
  C.wantPosters(st.lots.slice(st.idx, st.idx + 3));
}
function validName() {
  const el = document.getElementById("nm");
  const nm = (el ? el.value : S.name).trim();
  if (!nm) { S.ui.err = "Digite seu nome primeiro."; render(); document.getElementById("nm")?.focus(); return null; }
  S.name = nm; store.set("ml-name", nm); return nm;
}
async function createRoom() {
  const name = validName(); if (!name) return;
  S.ui.err = ""; S.mode = "online"; S.st = null; S.chat = [];
  N.connect(); render();
  await waitOpen();
  const r = await N.call("room:create", { name, token });
  if (r.error) { S.mode = null; S.ui.err = r.error; return render(); }
  enterRoom(r.code);
  if (!S.setup.draw.length && S.setup.lotMode !== "pick") drawLots();
}
async function joinRoom(watch) {
  const codeEl = document.getElementById("code");
  const code = (codeEl ? codeEl.value : S.joinCode).trim().toUpperCase();
  if (!/^[A-Z0-9]{4}$/.test(code)) { S.ui.err = "O código da sala tem 4 letras ou números."; return render(); }
  const name = watch ? (S.name || "Espectador") : validName(); if (!name) return;
  S.ui.err = ""; S.mode = "online"; S.code = code; S.st = null; S.chat = [];
  N.connect(); render();
  await waitOpen();
  const r = await N.call("room:join", { code, name, token, watch: !!watch });
  if (r.error) { S.mode = null; S.code = null; S.ui.err = r.error; return render(); }
  enterRoom(code);
  if (r.watching && !watch) toast("O leilão já começou. Você entrou como espectador.");
}
function waitOpen() {
  return new Promise((res) => {
    if (N.status === "on") return res();
    const t0 = Date.now();
    const iv = setInterval(() => { if (N.status === "on" || Date.now() - t0 > 8000) { clearInterval(iv); res(); } }, 100);
  });
}
function enterRoom(code) {
  S.code = code; store.set("ml-session", { code });
  try { history.replaceState(null, "", "/sala/" + code); } catch (e) {}
  render();
}
async function leave() {
  if (S.mode === "online") { await N.call("room:leave"); store.del("ml-session"); try { history.replaceState(null, "", "/"); } catch (e) {} }
  if (S.mode === "local" && S.local) { S.local = null; store.del("ml-local"); }
  S.mode = null; S.st = null; S.code = null; S.you = null; S.chat = []; S.ui.err = ""; S.joinCode = "";
  render();
}
function copyText(text, msg) {
  const done = () => toast(msg);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => toast("Não deu para copiar. Selecione e copie: " + text));
  else toast(text);
}

  if (id === "chatForm") {
    const el = document.getElementById("chatText"); const text = el.value.trim(); if (!text) return;
    el.value = "";
    const r = await N.call("chat:send", { text, name: S.name });
    if (r.error) { toast(r.error, true); el.value = text; }
  }
});
$app.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.lp != null) { S.setup.localPlayers[+t.dataset.lp] = t.value; saveSetup(); return; }
  if (t.id === "nm") { S.name = t.value; return; }
  const acctField = { "au-name": "name", "au-pass": "pass", "pw-old": "pwOld", "pw-new": "pwNew" }[t.id];
  if (acctField) { S.acct[acctField] = t.value; return; }
  if (t.id === "code") { t.value = t.value.toUpperCase().replace(/[^A-Z0-9]/g, ""); S.joinCode = t.value; return; }
  if (t.id === "bidv") { const st = cur(); if (st) S.ui.bidDraft = { lot: st.idx, v: +t.value }; }
  if (t.id === "donv") { S.ui.donate.v = +t.value; return syncDonate(); }
  if (t.id && t.id.startsWith("mbid-")) { bidDrafts[t.id.slice(5)] = t.value; return; }
  if (t.id && t.id.startsWith("lf-") && listDraft) {
    const k = t.id.slice(3);
    listDraft[k] = t.type === "checkbox" ? t.checked : t.value;
    if (k === "featured") render();   // o custo muda na hora
  }
  if (t.id === "donText") { S.ui.donate.text = t.value; return; }
});
$app.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "r-money") return setRule({ money: +t.value });
  if (t.id === "r-max") return setRule({ maxFilms: +t.value });
  if (t.id === "lots-n") { S.setup.lots = Math.max(1, Math.min(200, Math.floor(+t.value) || 1)); saveSetup(); render(); return scheduleDraw(); }
});
$app.addEventListener("keydown", (e) => {
  if (e.target.id === "bidv" && e.key === "Enter") {
    e.preventDefault();
    const st = cur(), lot = st && st.lot; if (!lot) return;
    if (lot.format === "classic") doAct("bid", +e.target.value, lot.turn);
    else if (lot.format === "sealed") { const pid = S.mode === "local" ? S.ui.sealedOpen : S.you; S.ui.sealedOpen = null; doAct("sealed", +e.target.value, pid); }
  }
});

/* ---------- rede ---------- */
N.on("state", (d) => {
  const wasPhase = S.st && S.st.phase;
  S.st = d.st; S.you = d.you; S.host = d.host; S.code = d.code; S.viewers = d.viewers;
  if (wasPhase !== "playing" && d.st.phase === "playing") S.lastTop = null;
  processFx(); render(); ensureSynopsis();
});
N.on("chat:history", (list) => { S.chat = list || []; render(); });
N.on("chat", (m) => { S.chat.push(m); if (S.chat.length > 120) S.chat.shift(); render(); if (m.donate) queueDonation(m); });
N.on("react", (r) => fxReact(r.e));
N.on("kicked", () => { store.del("ml-session"); S.mode = null; S.st = null; S.code = null; render(); toast("Você foi removido da sala.", true); });
N.on("market:me", (d) => { S.market = d; S.me = d.me; render(); });
N.on("market:auctions", (d) => { S.auctions = d; if (S.mode === "market") { render(); loadAccounts(); loadRanking(); } });
N.on("market:notice", (d) => toast(d.text));
N.on("auth:out", () => { signedOut(); render(); toast("Sua conta saiu deste aparelho. Entre de novo.", true); });
N.on("status", () => { if (S.mode === "online" || S.mode === "market") { const el = document.querySelector(".topbar .conn"); if (el) el.className = "conn " + N.status; } if (!S.mode) render(); });
N.on("open", async () => { if (!S.mode || (S.mode === "market" && !S.auth)) loadShowcase();
  if (S.auth) { await resumeAuth(); if (S.mode === "market" && S.me) refreshMarket(); }
  if (S.mode === "online" && S.code && S.st) {
    const r = await N.call("room:join", { code: S.code, name: S.name || "Espectador", token });
    if (r.error) { store.del("ml-session"); S.mode = null; S.st = null; render(); toast("A sala não existe mais.", true); }
  }
});
N.on("lost", () => { if (S.mode === "online") toast("Conexão perdida. Reconectando…", true); });

setInterval(() => { if (N.status === "on" && !document.hidden && (screen() === "home" || (S.mode === "market" && !S.me))) loadShowcase(); }, 20000);

/* ---------- loop local (relógios dos lotes no modo mesmo aparelho) ---------- */
setInterval(() => {
  if (S.mode === "local" && S.local && S.local.phase === "playing") {
    if (E.tick(S.local, Date.now())) afterLocal();
  }
}, 200);

/* ---------- prévia animada da tela inicial ---------- */
const DEMO = [["Cibele", 3], ["André", 5], ["Kirito", 6], ["Pinho", 9], ["Kirito", 11]];
let demoI = 0;
setInterval(() => {
  if (screen() !== "home" || document.hidden) return;
  const fill = document.querySelector(".demo-fill");
  if (demoI < DEMO.length) {
    const [n, v] = DEMO[demoI];
    fxAlert(null, brl(v), `${n} deu um lance`, n, E.COLORS[["Cibele", "André", "Kirito", "Pinho"].indexOf(n)]);
    if (fill) { fill.style.transition = "none"; fill.style.width = "100%"; requestAnimationFrame(() => { fill.style.transition = "width 2.2s linear"; fill.style.width = "0%"; }); }
  } else if (demoI === DEMO.length) fxStamp("Vendido!", `${DEMO_FILM.title} para Kirito por ${brl(11)}`);
  demoI = (demoI + 1) % (DEMO.length + 2);
}, 2400);

/* ---------- início ---------- */
C.onUpdate(() => { if (!S.ui.modal) render(); });
C.checkImdb();
C.wantPosters([DEMO_FILM]);
const session = store.get("ml-session");
if (N.available) {
  N.connect();
  if (session && session.code && (!urlCode || urlCode === session.code)) {
    S.mode = "online"; S.code = session.code;
    waitOpen().then(async () => {
      const r = await N.call("room:join", { code: session.code, name: S.name || "Espectador", token });
      if (r.error) { store.del("ml-session"); S.mode = null; S.code = null; try { history.replaceState(null, "", "/"); } catch (e) {} render(); }
      else enterRoom(session.code);
    });
  }
}
if (S.mode === "local" && S.local) ensureSynopsis();
render();
loop();
})();
</script>
</body></html>
