<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Martelo Live</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700;800&display=swap">
<style>/* ============================================================
   Martelo Live — identidade visual
   Conceito: o leilão é uma transmissão ao vivo. O lote é o "player",
   os lances chegam como alertas de live e o chat corre ao lado.
   Base ameixa profunda (não preto), vermelho "no ar" para o que é ao vivo,
   dourado para dinheiro, menta para "sua vez".
   ============================================================ */
:root {
  --ground: #150f1f;
  --surface: #1f172d;
  --raise: #2a2040;
  --line: #3a2e55;
  --ink: #f7f2ff;
  --mute: #a99cc4;
  --faint: #6f6390;
  --live: #ff4f6d;
  --coin: #ffd166;
  --coin-ink: #2a1a00;
  --mint: #4be3b0;
  --mint-ink: #032b1f;
  --display: "Unbounded", "Arial Black", "Segoe UI", system-ui, sans-serif;
  --body: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: var(--body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--ground); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--ink); }
:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.wrap {
  max-width: 1320px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- barra do topo ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--ground) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; }
.brand .word { font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: -0.02em; }
.onair { display: inline-flex; align-items: center; gap: 6px; background: var(--live); color: #fff; font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: 0.04em; padding: 4px 8px 4px 7px; border-radius: 6px; }
.onair::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: blink 1.6s infinite; }
.onair.idle { background: var(--raise); color: var(--mute); }
.onair.idle::before { background: var(--faint); animation: none; }
@keyframes blink { 50% { opacity: 0.25; } }
.topbar .spacer { flex: 1; }
.chip-code { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 6px 5px 12px; font-size: 13px; color: var(--mute); }
.chip-code b { font-family: var(--display); color: var(--ink); letter-spacing: 0.12em; font-size: 14px; }
.chip-code button { border: 0; background: var(--raise); border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
.viewers { font-size: 13px; color: var(--mute); display: inline-flex; gap: 6px; align-items: center; }
.viewers svg { width: 16px; height: 16px; }
.conn { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; }
@media (max-width: 560px) { .chip-code button, .topbar .viewers, .topbar .hint { display: none; } }
.conn.on { background: var(--mint); } .conn.connecting { background: var(--coin); } .conn.unavailable { background: var(--live); }

/* ---------- botões e campos ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--raise); padding: 10px 16px; border-radius: var(--r-sm); cursor: pointer; font-weight: 600; line-height: 1.2; transition: background 0.15s, border-color 0.15s, transform 0.06s; text-decoration: none; }
.btn:hover { border-color: var(--mute); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn.go { background: var(--live); border-color: var(--live); color: #fff; }
.btn.go:hover { filter: brightness(1.08); }
.btn.coin { background: var(--coin); border-color: var(--coin); color: var(--coin-ink); }
.btn.mint { background: var(--mint); border-color: var(--mint); color: var(--mint-ink); }
.btn.ghost { background: transparent; }
.btn.quiet { background: transparent; border-color: transparent; color: var(--mute); padding-inline: 10px; }
.btn.quiet:hover { color: var(--ink); }
.btn.big { font-family: var(--display); font-weight: 700; font-size: 16px; padding: 14px 22px; border-radius: var(--r-md); letter-spacing: -0.01em; }
.input { width: 100%; min-width: 0; background: var(--ground); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; }
.input:focus { outline: none; border-color: var(--mint); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .label { font-size: 13px; color: var(--mute); font-weight: 500; }
.hint { font-size: 13px; color: var(--mute); margin: 0; }
.err { color: var(--live); font-size: 14px; margin: 0; font-weight: 500; }
.money { position: relative; }
.money span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--mute); font-size: 14px; pointer-events: none; }
.money .input { padding-left: 38px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 13px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.switch { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--ground); cursor: pointer; text-align: left; width: 100%; }
.switch .knob { flex: none; width: 38px; height: 22px; border-radius: 999px; background: var(--raise); border: 1px solid var(--line); position: relative; margin-top: 2px; transition: background 0.15s; }
.switch .knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--mute); transition: transform 0.15s, background 0.15s; }
.switch[aria-pressed="true"] { border-color: color-mix(in srgb, var(--mint) 50%, var(--line)); }
.switch[aria-pressed="true"] .knob { background: color-mix(in srgb, var(--mint) 30%, var(--raise)); }
.switch[aria-pressed="true"] .knob::after { transform: translateX(16px); background: var(--mint); }
.switch b { display: block; font-weight: 600; }
.switch span { font-size: 13px; color: var(--mute); }
.switch[disabled] { cursor: default; opacity: 0.85; }

/* ---------- painéis ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel h2 { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .grid-3 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }

/* ---------- home ---------- */
.home { padding-block: 36px 64px; display: flex; flex-direction: column; gap: 48px; }
.hero { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 40px; align-items: center; }
@media (max-width: 900px) { .hero { grid-template-columns: minmax(0, 1fr); gap: 28px; } }
.hero h1 { font-family: var(--display); font-weight: 800; font-size: clamp(34px, 5.4vw, 64px); line-height: 1.02; letter-spacing: -0.035em; }
.hero p.lede { font-size: 18px; color: var(--mute); max-width: 46ch; margin: 18px 0 0; }
.entry { display: flex; flex-direction: column; gap: 12px; margin-top: 28px; max-width: 460px; }
.entry .row { display: flex; gap: 8px; }
.entry .row .input { flex: 1; }
.entry .code-in { font-family: var(--display); letter-spacing: 0.2em; text-transform: uppercase; text-align: center; max-width: 140px; }
.divider { display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: 13px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.formats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.fmt { border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); }
.fmt .ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--raise); font-size: 18px; }
.fmt b { font-weight: 700; font-size: 16px; }
.fmt p { margin: 0; color: var(--mute); font-size: 14px; }
.fmt.extra .ico { background: color-mix(in srgb, var(--coin) 18%, var(--raise)); }
.section-title { font-family: var(--display); font-size: 20px; font-weight: 700; margin-bottom: 14px; letter-spacing: -0.01em; }

/* ---------- palco (o "player" da transmissão) ---------- */
.stage { position: relative; border-radius: var(--r-lg); overflow: hidden; background: #0a0710; aspect-ratio: 16 / 9; isolation: isolate; border: 1px solid var(--line); }
@media (max-width: 760px) { .stage { aspect-ratio: auto; } }
.stage .backdrop { position: absolute; inset: 0; z-index: -2; background: var(--bd, linear-gradient(135deg, #3a1f4f, #120c1c)); }
.stage .backdrop img { width: 100%; height: 100%; object-fit: cover; filter: blur(36px) saturate(1.5) brightness(0.55); transform: scale(1.25); }
.stage::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(12, 8, 20, 0.92) 0%, rgba(12, 8, 20, 0.7) 45%, rgba(12, 8, 20, 0.35) 100%), linear-gradient(0deg, rgba(12, 8, 20, 0.9), transparent 40%); }
.stage .content { position: relative; height: 100%; display: grid; grid-template-columns: minmax(0, 28%) minmax(0, 1fr); gap: clamp(14px, 2.4vw, 32px); align-items: center; padding: clamp(46px, 5vw, 64px) clamp(16px, 3vw, 40px) clamp(30px, 4vw, 48px); }
@media (max-width: 760px) {
  .stage .content { grid-template-columns: minmax(0, 110px) minmax(0, 1fr); align-items: start; padding: 4px 16px 30px; }
  .stage .hud.top { position: relative; flex-wrap: wrap; padding: 12px 16px; }
  .stage .lot-dots { display: none; }
}
.hud .tag { white-space: nowrap; }
.stage .content .poster { box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55); border-radius: 12px; }
.stage .info { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.stage h2.title { font-family: var(--display); font-weight: 800; font-size: clamp(22px, 3.4vw, 46px); line-height: 1.02; letter-spacing: -0.03em; }
.stage .orig { color: var(--mute); font-size: 14px; margin-top: -4px; }
.stage .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.12); color: var(--ink); white-space: nowrap; }
.chip.score { background: var(--coin); color: var(--coin-ink); border-color: var(--coin); font-weight: 700; }
.synopsis { font-size: 14px; color: color-mix(in srgb, var(--ink) 82%, transparent); max-width: 62ch; margin: 0; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.synopsis.open { -webkit-line-clamp: unset; display: block; }
.syn-foot { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--mute); }
.syn-foot button { background: none; border: 0; color: var(--ink); text-decoration: underline; cursor: pointer; padding: 0; font-size: 12px; }
.hud { position: absolute; left: 0; right: 0; display: flex; align-items: center; gap: 8px; padding: 14px clamp(14px, 2vw, 22px); z-index: 2; }
.hud.top { top: 0; }
.hud .tag { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 6px; background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(8px); }
.hud .fmt-tag { margin-left: auto; background: rgba(255, 255, 255, 0.12); }
.scrub { position: absolute; left: 0; right: 0; bottom: 0; height: 26px; display: flex; align-items: flex-end; z-index: 2; }
.scrub .track { position: relative; width: 100%; height: 5px; background: rgba(255, 255, 255, 0.12); }
.scrub .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--live); }
.scrub .fill.calm { background: var(--mint); }
.scrub .secs { position: absolute; right: 14px; bottom: 10px; font-family: var(--display); font-size: 12px; font-weight: 700; color: #fff; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6); }
.lot-dots { display: flex; gap: 3px; }
.lot-dots i { width: 14px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.18); }
.lot-dots i.done { background: rgba(255, 255, 255, 0.5); }
.lot-dots i.now { background: var(--live); width: 22px; }

/* ---------- pôster ---------- */
.poster { position: relative; aspect-ratio: 2 / 3; width: 100%; max-width: 100%; border-radius: 8px; overflow: hidden; container-type: inline-size; background: var(--raise); }
.poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.poster .gen { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; padding: 9%; }
.poster .gen b { font-family: var(--display); font-weight: 800; line-height: 0.98; letter-spacing: -0.02em; font-size: clamp(8px, 13cqw, 40px); color: #fff; text-wrap: balance; }
.poster .gen i { font-style: normal; font-size: clamp(7px, 7cqw, 14px); color: rgba(255, 255, 255, 0.7); }

/* ---------- mesa de lances ---------- */
.deck { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.4fr); gap: 16px; align-items: center; }
@media (max-width: 760px) { .deck { grid-template-columns: minmax(0, 1fr); } }
.deck.mine { border-color: color-mix(in srgb, var(--mint) 60%, var(--line)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--mint) 35%, transparent), 0 12px 40px color-mix(in srgb, var(--mint) 12%, transparent); }
.deck .readout { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.deck .readout .label { font-size: 13px; }
.deck .readout .val { font-family: var(--display); font-weight: 800; font-size: clamp(34px, 4.6vw, 54px); line-height: 1; letter-spacing: -0.03em; color: var(--coin); }
.deck .readout .val.zero { color: var(--faint); }
.deck .readout .by { font-size: 14px; color: var(--mute); }
.deck .readout .by b { color: var(--ink); }
.deck .controls { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.turnline { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.turnline .who { font-weight: 700; }
.turnline .you { color: var(--mint); font-weight: 700; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 14px; color: #160d22; flex: none; }
.avatar.sm { width: 24px; height: 24px; font-size: 11px; }
.bidrow { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
.stepper { display: flex; flex: 1 1 180px; min-width: 0; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; background: var(--ground); }
.stepper button { width: 46px; border: 0; background: var(--raise); cursor: pointer; font-size: 20px; }
.stepper input { flex: 1; min-width: 0; width: 60px; border: 0; background: transparent; text-align: center; font-family: var(--display); font-weight: 700; font-size: 22px; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.stepper input:focus { outline: none; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { flex: 1; min-width: 58px; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-weight: 600; font-size: 13px; }
.quick button:hover:not(:disabled) { border-color: var(--coin); color: var(--coin); }
.quick button:disabled { opacity: 0.3; cursor: not-allowed; }
.actions { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 8px; }
.submitted { display: flex; flex-wrap: wrap; gap: 6px; }
.submitted span { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--mute); display: inline-flex; gap: 5px; align-items: center; }
.submitted span.ok { color: var(--mint); border-color: color-mix(in srgb, var(--mint) 45%, var(--line)); }
.privacy { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; padding: 14px; border-radius: var(--r-md); border: 1px dashed var(--line); background: var(--ground); }
.privacy b { font-size: 16px; }
.dutch-btns { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.dutch-btns .btn { flex-direction: column; gap: 2px; padding: 10px; }
.dutch-btns .btn small { font-weight: 500; font-size: 12px; opacity: 0.8; }
.falling { font-size: 13px; color: var(--live); font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.result { display: flex; flex-direction: column; gap: 10px; }
.reveal { display: flex; flex-direction: column; gap: 6px; }
.reveal .row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 8px; background: var(--ground); }
.reveal .row.win { background: color-mix(in srgb, var(--coin) 16%, var(--ground)); }
.reveal .row b.num { font-family: var(--display); }

/* ---------- jogadores ---------- */
.crew { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 10px; }
.pc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.pc.turn { border-color: var(--mint); }
.pc.off { opacity: 0.6; }
.pc .top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.pc .name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center; min-width: 0; }
.pc .name small { font-weight: 600; font-size: 11px; color: var(--mint); }
.pc .cash { margin-left: auto; font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--coin); flex: none; }
.pc .row2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.slots { display: flex; gap: 3px; flex-wrap: wrap; }
.slots i { width: 10px; height: 15px; border-radius: 2px; border: 1px solid var(--line); }
.slots i.full { background: var(--pc); border-color: var(--pc); }
.pill { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill.in { background: color-mix(in srgb, var(--mint) 18%, transparent); color: var(--mint); }
.pill.top { background: var(--coin); color: var(--coin-ink); }
.pill.out { background: var(--raise); color: var(--mute); }
.pill.wait { background: color-mix(in srgb, var(--live) 18%, transparent); color: var(--live); }
.pill.sent { background: color-mix(in srgb, var(--mint) 18%, transparent); color: var(--mint); }
.owned { display: flex; gap: 5px; flex-wrap: wrap; }
.owned .zoom { width: 34px; }
.zoom { display: block; width: 100%; cursor: zoom-in; border-radius: 6px; background: none; border: 0; padding: 0; }
.zoom .poster { transition: transform 0.12s; outline: 2px solid transparent; outline-offset: 2px; }
.zoom:hover .poster, .zoom:focus-visible .poster { transform: translateY(-2px); outline-color: var(--coin); }
.crown { color: var(--coin); font-size: 13px; }

/* ---------- extras: bolsa de gêneros e missão ---------- */
.extras { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 10px; }
@media (max-width: 760px) { .extras { grid-template-columns: minmax(0, 1fr); } }
.ticker { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.tick { flex: none; display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; border-radius: 10px; background: var(--ground); border: 1px solid var(--line); min-width: 108px; }
.tick b { font-size: 13px; }
.tick span { font-size: 12px; color: var(--mute); }
.tick.hot { border-color: color-mix(in srgb, var(--coin) 55%, var(--line)); }
.tick.hot em { font-style: normal; color: var(--coin); font-weight: 700; font-size: 12px; }
.mission { display: flex; gap: 12px; align-items: flex-start; }
.mission .seal { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--live) 22%, var(--raise)); font-size: 18px; flex: none; }
.mission p { margin: 0; }
.mission .pts { color: var(--coin); font-weight: 700; font-size: 13px; }

/* ---------- layout ao vivo ---------- */
.live { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding-block: 16px 40px; align-items: start; }
@media (max-width: 1080px) { .live { grid-template-columns: minmax(0, 1fr); } }
.live .main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); height: calc(100vh - 100px); min-height: 420px; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; min-width: 0; }
@media (max-width: 1080px) { .side { position: static; height: 460px; } }
.side .head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.side .head b { font-family: var(--display); font-size: 15px; font-weight: 700; }
.feed { flex: 1; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.feed .msg { font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
.feed .msg .n { font-weight: 700; margin-right: 6px; }
.feed .msg.watcher .n { color: var(--mute) !important; }
.feed .sys { font-size: 13px; color: var(--mute); display: flex; gap: 8px; align-items: baseline; }
.feed .sys::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); transform: translateY(-2px); }
.feed .sys.bid::before { background: var(--coin); }
.feed .sys.sold { color: var(--ink); background: color-mix(in srgb, var(--coin) 12%, transparent); border-radius: 8px; padding: 6px 8px; }
.feed .sys.sold::before { background: var(--coin); }
.feed .sys.lot { color: var(--ink); font-weight: 600; padding-top: 6px; }
.feed .sys.lot::before { background: var(--live); }
.feed .sys b { color: var(--ink); }
.reacts { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; padding: 8px 12px 0; }
.reacts button { border: 1px solid var(--line); background: var(--ground); border-radius: 10px; height: 34px; min-width: 0; padding: 0; cursor: pointer; font-size: 17px; line-height: 1; }
.reacts button:hover { border-color: var(--mute); transform: translateY(-1px); }
.compose { display: flex; gap: 8px; padding: 10px 12px 12px; }
.compose .input { flex: 1; }

/* ---------- sala (lobby) ---------- */
.room { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) 320px; gap: 14px; padding-block: 18px 110px; align-items: start; }
@media (max-width: 1180px) { .room { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); } .room .side { grid-column: 1 / -1; } }
@media (max-width: 820px) { .room { grid-template-columns: minmax(0, 1fr); } }
.room.solo { grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); }
@media (max-width: 820px) { .room.solo { grid-template-columns: minmax(0, 1fr); } }
.room .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.invite { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: var(--r-md); background: linear-gradient(140deg, color-mix(in srgb, var(--live) 24%, var(--surface)), var(--surface)); border: 1px solid color-mix(in srgb, var(--live) 40%, var(--line)); }
.invite .code { font-family: var(--display); font-weight: 800; font-size: 40px; letter-spacing: 0.14em; line-height: 1; }
.invite .link { font-size: 13px; color: var(--mute); overflow-wrap: anywhere; user-select: all; }
.plist { display: flex; flex-direction: column; gap: 8px; }
.prow { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm); background: var(--ground); border: 1px solid var(--line); min-width: 0; }
.prow .nm { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .input { flex: 1; }
.prow .x { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: transparent; cursor: pointer; color: var(--mute); flex: none; }
.prow .x:hover { color: var(--live); border-color: var(--live); }
.fmt-pick { display: flex; flex-direction: column; gap: 8px; }
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .modes { grid-template-columns: minmax(0, 1fr); } }
.mode { border: 1px solid var(--line); background: var(--ground); border-radius: var(--r-md); padding: 10px 12px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.mode b { font-weight: 700; }
.mode span { font-size: 12px; color: var(--mute); }
.mode[aria-pressed="true"] { border-color: var(--live); background: color-mix(in srgb, var(--live) 10%, var(--ground)); }
.genres { display: flex; flex-wrap: wrap; gap: 6px; }
.genres button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.genres button[aria-pressed="true"] { background: var(--coin); color: var(--coin-ink); border-color: var(--coin); font-weight: 600; }
.curtain { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 16px; border-radius: var(--r-md); background: repeating-linear-gradient(90deg, var(--raise) 0 18px, color-mix(in srgb, var(--raise) 70%, var(--ground)) 18px 36px); border: 1px solid var(--line); }
.curtain b { font-family: var(--display); font-size: 18px; }
.curtain p { margin: 2px 0 0; color: var(--mute); font-size: 13px; }
.pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 10px; max-height: 440px; overflow: auto; padding: 2px 4px 2px 2px; }
.pool-item { position: relative; display: flex; flex-direction: column; gap: 4px; min-width: 0; border: 0; background: none; padding: 0; text-align: left; }
.pool-item .t { font-size: 12px; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.pool-item .s { font-size: 11px; color: var(--coin); }
.pool-item.pick { cursor: pointer; }
.pool-item.pick .poster { outline: 2px solid transparent; outline-offset: 2px; }
.pool-item.pick[aria-pressed="false"] .poster { opacity: 0.5; }
.pool-item.pick[aria-pressed="true"] .poster { outline-color: var(--live); }
.pool-item .check { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%; background: var(--live); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 800; z-index: 2; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar .hint { flex: 1; min-width: 160px; }
.search { display: flex; gap: 8px; }
.search .input { flex: 1; }
.results { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow: auto; }
.result { display: flex; gap: 10px; align-items: center; padding: 6px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--ground); }
.result .ph { width: 34px; flex: none; }
.result .meta { flex: 1; min-width: 0; }
.result .meta b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.result .meta span { font-size: 12px; color: var(--mute); }
.startbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: color-mix(in srgb, var(--ground) 92%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.startbar .wrap { display: flex; align-items: center; gap: 14px; justify-content: space-between; flex-wrap: wrap; padding-block: 12px; }
.rules-read { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.rules-read div { background: var(--ground); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; }
.rules-read span { display: block; font-size: 12px; color: var(--mute); }
.rules-read b { font-family: var(--display); font-size: 16px; }

/* ---------- fim da transmissão ---------- */
.final { padding-block: 20px 60px; display: flex; flex-direction: column; gap: 18px; }
.champion { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: center; padding: 22px; border-radius: var(--r-lg); border: 1px solid color-mix(in srgb, var(--coin) 45%, var(--line)); background: radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--coin) 22%, var(--surface)), var(--surface) 60%); }
.champion .avatar { width: 84px; height: 84px; font-size: 34px; }
.champion h1 { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 4.6vw, 52px); letter-spacing: -0.03em; line-height: 1.02; }
.champion p { margin: 6px 0 0; color: var(--mute); }
.standings { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.stand { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stand .head { display: flex; align-items: center; gap: 12px; }
.stand .head h3 { font-family: var(--display); font-size: 20px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stand .rank { font-family: var(--display); font-weight: 800; font-size: 30px; color: var(--pc); }
.breakdown { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.breakdown div { background: var(--ground); border-radius: 8px; padding: 8px; }
.breakdown span { display: block; font-size: 11px; color: var(--mute); }
.breakdown b { font-family: var(--display); font-size: 17px; }
.breakdown .total { background: color-mix(in srgb, var(--coin) 18%, var(--ground)); }
.breakdown .total b { color: var(--coin); }
.coll { display: flex; flex-direction: column; gap: 6px; }
.coll .item { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; }
.coll .item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.coll .item small { display: block; color: var(--mute); font-size: 12px; }
.coll .item .paid { color: var(--coin); font-weight: 700; }
.mis-list { display: flex; flex-direction: column; gap: 6px; }
.mis-list div { display: flex; gap: 8px; font-size: 13px; align-items: baseline; }
.mis-list .ok { color: var(--mint); font-weight: 700; }
.mis-list .no { color: var(--faint); font-weight: 700; }
.empty { color: var(--mute); font-size: 14px; }

/* ---------- efeitos ao vivo (camada sobre o palco) ---------- */
#fx { position: fixed; pointer-events: none; z-index: 18; overflow: hidden; }
.fx-alert { position: absolute; left: 16px; bottom: 40px; display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 10px; border-radius: 14px; background: rgba(14, 9, 22, 0.88); border: 1px solid rgba(255, 255, 255, 0.14); backdrop-filter: blur(10px); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5); animation: alertIn 3.2s cubic-bezier(.2, .9, .2, 1) forwards; max-width: calc(100% - 32px); }
.fx-alert .avatar { width: 40px; height: 40px; font-size: 16px; }
.fx-alert b { font-family: var(--display); font-size: 18px; color: var(--coin); display: block; line-height: 1.1; }
.fx-alert span { font-size: 13px; color: var(--ink); }
@keyframes alertIn { 0% { transform: translateX(-120%); } 10% { transform: translateX(0); } 85% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(0); opacity: 0; } }
.fx-stamp { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-4deg); text-align: center; padding: 16px 28px; border-radius: 16px; background: var(--coin); color: var(--coin-ink); box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55); animation: stamp 2.6s cubic-bezier(.2, .9, .2, 1) forwards; max-width: 86%; }
.fx-stamp b { font-family: var(--display); font-weight: 800; font-size: clamp(26px, 4.6vw, 54px); letter-spacing: -0.03em; display: block; line-height: 1; }
.fx-stamp span { font-weight: 600; font-size: 15px; }
.fx-stamp.flat { background: var(--raise); color: var(--ink); }
@keyframes stamp { 0% { transform: translate(-50%, -50%) rotate(-4deg) scale(1.6); opacity: 0; } 12% { transform: translate(-50%, -50%) rotate(-4deg) scale(1); opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) rotate(-4deg) scale(0.96); } }
.fx-react { position: absolute; bottom: 10px; font-size: 30px; animation: floatUp 2.4s ease-out forwards; }
@keyframes floatUp { 0% { transform: translateY(0) scale(0.6); opacity: 0; } 15% { opacity: 1; transform: translateY(-30px) scale(1.1); } 100% { transform: translateY(-260px) translateX(var(--dx, 0)) scale(1); opacity: 0; } }

/* ---------- donate na sala ---------- */
.donate-panel { border-color: color-mix(in srgb, var(--coin) 40%, var(--line)); background: linear-gradient(160deg, color-mix(in srgb, var(--coin) 10%, var(--surface)), var(--surface) 55%); }
.don-preview { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: var(--r-md); background: var(--ground); border: 1px dashed var(--line); }
.don-preview .emo { font-size: 30px; line-height: 1; }
.don-preview b { display: block; font-family: var(--display); font-size: 14px; }
.prow .donated { font-size: 12px; font-weight: 700; color: var(--coin); white-space: nowrap; }
/* o alerta: --lvl vai de 1 a 60 e cresce a cada real; a classe k0…k10 troca o visual por faixa */
.don-layer { position: fixed; inset: 0; z-index: 45; pointer-events: none; overflow: hidden; display: grid; justify-items: center; align-items: start; padding: calc(84px + env(safe-area-inset-top, 0px)) 16px 16px; }
.don-card { position: relative; width: min(calc(320px + var(--lvl) * 3px), 100%); text-align: center; padding: 18px 24px 20px; border-radius: 20px; background: var(--surface); border: 2px solid var(--coin); color: var(--ink);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), 0 0 calc(var(--lvl) * 1.4px) color-mix(in srgb, var(--coin) 70%, transparent);
  animation: donIn var(--dur) cubic-bezier(.2, .9, .2, 1) forwards; }
.don-emo { font-size: calc(40px + var(--lvl) * 0.8px); line-height: 1.1; display: inline-block; animation: donBounce 0.9s ease-in-out infinite; }
.don-title { font-family: var(--display); font-weight: 800; font-size: calc(12px + var(--lvl) * 0.2px); letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }
.don-amount { font-family: var(--display); font-weight: 800; font-size: calc(36px + var(--lvl) * 0.9px); line-height: 1.05; letter-spacing: -0.03em; color: var(--coin); }
.don-who { display: inline-flex; gap: 8px; align-items: center; margin-top: 6px; font-size: 15px; }
.don-who b { color: var(--pc); }
.don-msg { margin: 10px 0 0; font-size: calc(15px + var(--lvl) * 0.1px); font-weight: 600; overflow-wrap: anywhere; }
.don-rain i { position: absolute; top: -60px; font-style: normal; animation-name: donFall; animation-timing-function: linear; animation-fill-mode: both; }
.don-dim { position: absolute; inset: 0; background: rgba(8, 5, 14, 0.7); animation: donFade var(--dur) linear forwards; }
.don-flash { position: absolute; inset: 0; background: #fff; opacity: 0; animation: donFlash 0.7s ease-out; }
.don-rays { position: absolute; left: 50%; top: 50%; width: 220vmax; height: 220vmax; margin: -110vmax 0 0 -110vmax; opacity: 0.35;
  background: repeating-conic-gradient(from 0deg, var(--coin) 0 6deg, transparent 6deg 18deg); animation: donSpin 6s linear infinite, donFade var(--dur) linear forwards; }
.k1 .don-card { background: linear-gradient(150deg, color-mix(in srgb, var(--coin) 22%, var(--surface)), var(--surface)); }
.k2 .don-card { border-color: var(--mint); background: linear-gradient(150deg, color-mix(in srgb, var(--mint) 24%, var(--surface)), var(--surface)); }
.k2 .don-amount { color: var(--mint); }
.k3 .don-card { border-color: #ff9d5c; background: linear-gradient(170deg, #5a1d1d, #2a1220 70%); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), 0 0 calc(20px + var(--lvl) * 1.5px) #ff6a3d; }
.k3 .don-emo { animation: donFlicker 0.25s steps(2) infinite; }
.k4 .don-card { border-color: #7aa7ff; background: linear-gradient(170deg, #1f2c66, #160f2c); animation-name: donRocket; }
.k4 .don-amount { color: #a9c4ff; }
.k5 .don-card, .k8 .don-card, .k9 .don-card, .k10 .don-card { border-color: transparent; background: linear-gradient(var(--surface), var(--surface)) padding-box, conic-gradient(#ff4f6d, #ffd166, #4be3b0, #7aa7ff, #b48cff, #ff4f6d) border-box; border-width: 4px; }
.k5 .don-amount { background: linear-gradient(90deg, #7aa7ff, #ff8fd8, #5ee0f0); -webkit-background-clip: text; background-clip: text; color: transparent; }
.k6 .don-card { border-color: #fff3c4; background: linear-gradient(140deg, #ffd166, #ff9d5c); color: var(--coin-ink); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), 0 0 calc(30px + var(--lvl) * 1.5px) var(--coin); }
.k6 .don-title, .k6 .don-who b { color: var(--coin-ink); }
.k6 .don-amount { color: #2a1a00; }
.k7 .don-card { border-color: #ff4f2d; background: radial-gradient(120% 100% at 50% 100%, #ff4f2d, #3a0d0d 60%, #12060a); box-shadow: 0 0 calc(40px + var(--lvl) * 2px) #ff4f2d; }
.k7 .don-amount { color: #ffe08a; text-shadow: 0 0 18px #ff6a00, 0 0 40px #ff2d00; }
.don-layer.k8, .don-layer.k9, .don-layer.k10 { align-items: center; padding-top: 16px; }
.k8 .don-card, .k9 .don-card, .k10 .don-card { animation: donIn var(--dur) cubic-bezier(.2, .9, .2, 1) forwards, donHue 1.6s linear infinite; }
.k8 .don-amount, .k9 .don-amount, .k10 .don-amount { color: #fff; text-shadow: 0 0 20px var(--coin), 0 0 50px var(--live); }
.k8 .don-title, .k9 .don-title, .k10 .don-title { color: var(--coin); }
.k10 .don-flash { animation: donFlash 0.3s ease-out 7 alternate; }
#app.shaking > main { animation: donShake 0.11s linear infinite; }
@keyframes donIn { 0% { transform: translateY(-40px) scale(calc(var(--scale) * 0.4)); opacity: 0; } 6% { transform: translateY(0) scale(calc(var(--scale) * 1.08)); opacity: 1; } 10% { transform: scale(var(--scale)); } 90% { transform: scale(var(--scale)); opacity: 1; } 100% { transform: translateY(-20px) scale(calc(var(--scale) * 0.9)); opacity: 0; } }
@keyframes donRocket { 0% { transform: translateY(80vh) scale(var(--scale)); opacity: 0; } 8% { transform: translateY(-14px) scale(var(--scale)); opacity: 1; } 12% { transform: translateY(0) scale(var(--scale)); } 90% { transform: translateY(0) scale(var(--scale)); opacity: 1; } 100% { transform: translateY(-90vh) scale(var(--scale)); opacity: 0; } }
@keyframes donBounce { 50% { transform: translateY(-8px) rotate(-6deg) scale(1.08); } }
@keyframes donFlicker { 50% { transform: scale(1.12) rotate(4deg); filter: brightness(1.4); } }
@keyframes donFall { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(calc(100vh + 120px)) rotate(540deg); opacity: 0.9; } }
@keyframes donFlash { 0% { opacity: 0.85; } 100% { opacity: 0; } }
@keyframes donFade { 0%, 88% { opacity: 1; } 100% { opacity: 0; } }
@keyframes donSpin { to { transform: rotate(360deg); } }
@keyframes donHue { to { filter: hue-rotate(360deg); } }
@keyframes donShake { 0% { transform: translate(0, 0); } 25% { transform: translate(var(--shake), calc(var(--shake) * -0.5)); } 50% { transform: translate(calc(var(--shake) * -0.6), var(--shake)); } 75% { transform: translate(calc(var(--shake) * -1), calc(var(--shake) * -0.4)); } 100% { transform: translate(0, 0); } }

/* ---------- Mercado: conta e carteira ---------- */
.market { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; padding-block: 18px 60px; align-items: start; }
@media (max-width: 820px) { .market { grid-template-columns: minmax(0, 1fr); } }
.market .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.market .auth-panel { grid-column: 1 / -1; width: min(460px, 100%); justify-self: center; }
.market-title { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 4vw, 40px); letter-spacing: -0.03em; }
.market .entry { margin-top: 0; }
.wallet { border-color: color-mix(in srgb, var(--coin) 45%, var(--line)); background: radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--coin) 16%, var(--surface)), var(--surface) 60%); }
.wallet .bal { display: flex; flex-direction: column; gap: 2px; }
.wallet .bal .label { font-size: 13px; }
.wallet .bal b { font-family: var(--display); font-weight: 800; font-size: clamp(36px, 5vw, 54px); line-height: 1; letter-spacing: -0.03em; color: var(--coin); }
.ledger { display: flex; flex-direction: column; gap: 6px; max-height: 360px; overflow-y: auto; }
.lrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: baseline; padding: 8px 10px; border-radius: var(--r-sm); background: var(--ground); border: 1px solid var(--line); font-size: 14px; }
.lrow small { color: var(--mute); }
.lrow .when { font-size: 12px; color: var(--mute); }
.lrow b { font-family: var(--display); font-size: 15px; }
.lrow b.in { color: var(--mint); }
.lrow b.out { color: var(--live); }
.acct-form { display: flex; gap: 8px; flex-wrap: wrap; }
.acct-form .input { flex: 1 1 140px; }
.chip-acct { display: inline-flex; align-items: center; gap: 8px; border: 1px solid color-mix(in srgb, var(--coin) 45%, var(--line)); background: var(--surface); border-radius: 999px; padding: 3px 12px 3px 3px; cursor: pointer; font-size: 13px; }
.chip-acct .avatar { background: var(--coin); }
.chip-acct .nm { color: var(--coin); font-weight: 600; white-space: nowrap; }
@media (max-width: 560px) { .chip-acct .nm { display: none; } .chip-acct { padding-right: 3px; } }
.temp-pass { font-family: var(--display); font-size: 26px; letter-spacing: 0.08em; margin: 0; color: var(--coin); user-select: all; }

/* ---------- emojis no chat ---------- */
.feed .msg.big { font-size: 26px; line-height: 1.25; }
.feed .msg.big .n { font-size: 14px; vertical-align: middle; }

<div id="app"></div>
<script>window.ML_OFFLINE = true;</script>
<script>/* ============================================================
   Martelo Live — motor do jogo
   Roda igual no servidor (Node) e no navegador (modo local).
   Todo o estado é um objeto simples (serializável em JSON).
   O tempo entra sempre como parâmetro `now` (ms), nunca é lido aqui dentro,
   para que servidor e cliente controlem os relógios.
   ============================================================ */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.Engine = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  const COLORS = ["#ff4f6d", "#ffd166", "#4be3b0", "#7aa7ff", "#ff8fd8", "#b48cff", "#ff9d5c", "#5ee0f0", "#d7f26b", "#f2f2f2"];
  const GROUP_TAG = "Indicados pelo grupo";
  const FORMATS = {
    classic: { name: "Aberto", short: "Aberto", desc: "Lances em turnos. Quem passa sai do lote." },
    sealed: { name: "Lance secreto", short: "Secreto", desc: "Todos lançam escondido ao mesmo tempo. Maior lance leva." },
    dutch: { name: "Relógio holandês", short: "Relógio", desc: "O preço cai a cada segundo. Quem apertar primeiro compra." }
  };
  const MAX_PLAYERS = 10;
  const MARKET_BONUS = [3, 2, 1]; // pontos por filme dos 3 gêneros mais disputados

  const DEFAULTS = {
    money: 20,
    maxFilms: 3,
    formats: ["classic"],   // mais de um = cada lote sorteia o formato
    market: false,          // Mercado de gêneros
    missions: false,        // Missões secretas
    turnSeconds: 20,        // tempo por vez no Aberto (0 = sem limite)
    sealedSeconds: 25,      // tempo do Lance secreto (0 = sem limite)
    dutchStepMs: 900,       // a cada quanto tempo o relógio cai R$ 1
    autoNextSeconds: 8      // passa para o próximo lote sozinho (0 = só o host)
  };

  /* ---------- utilidades ---------- */
  const int = (v, min, max, def) => {
    v = Math.floor(Number(v));
    if (!Number.isFinite(v)) return def;
    return Math.max(min, Math.min(max, v));
  };
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const shuffle = (arr, rng) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };
  const primaryGenre = (f) => ((f.g || []).filter((x) => x !== GROUP_TAG)[0]) || "Outros";
  const decade = (y) => (y ? Math.floor(+y / 10) * 10 : null);

  function cleanSettings(s, base) {
    const b = Object.assign({}, DEFAULTS, base || {});
    s = s || {};
    const formats = Array.isArray(s.formats) ? s.formats.filter((f) => FORMATS[f]) : b.formats;
    return {
      money: int(s.money ?? b.money, 1, 9999, DEFAULTS.money),
      maxFilms: int(s.maxFilms ?? b.maxFilms, 1, 50, DEFAULTS.maxFilms),
      formats: formats.length ? [...new Set(formats)] : ["classic"],
      market: !!(s.market ?? b.market),
      missions: !!(s.missions ?? b.missions),
      turnSeconds: int(s.turnSeconds ?? b.turnSeconds, 0, 300, DEFAULTS.turnSeconds),
      sealedSeconds: int(s.sealedSeconds ?? b.sealedSeconds, 0, 300, DEFAULTS.sealedSeconds),
      dutchStepMs: int(s.dutchStepMs ?? b.dutchStepMs, 300, 5000, DEFAULTS.dutchStepMs),
      autoNextSeconds: int(s.autoNextSeconds ?? b.autoNextSeconds, 0, 120, DEFAULTS.autoNextSeconds)
    };
  }

  /* ---------- criação e lobby ---------- */
  function create(settings) {
    return {
      phase: "lobby",          // lobby | playing | over
      settings: cleanSettings(settings),
      players: [],             // {id, name, color, money, donated, films[], connected, missions[]}
      lots: [], idx: 0, lot: null,
      results: [], log: [],
      seq: 0,                  // muda a cada alteração (para saber quando reenviar)
      nextColor: 0
    };
  }
  function addPlayer(st, id, name) {
    name = String(name || "").replace(/\s+/g, " ").trim().slice(0, 18);
    if (!name) return "Digite um nome para entrar.";
    if (st.phase !== "lobby") return "O leilão já começou. Você pode assistir.";
    if (st.players.length >= MAX_PLAYERS) return `A sala está cheia (máximo de ${MAX_PLAYERS} jogadores).`;
    if (st.players.some((p) => p.name.toLowerCase() === name.toLowerCase())) return "Já tem alguém com esse nome na sala.";
    st.players.push({ id, name, color: COLORS[st.nextColor++ % COLORS.length], money: 0, donated: 0, films: [], connected: true, missions: [] });
    st.seq++;
    return null;
  }
  function removePlayer(st, id) {
    if (st.phase !== "lobby") return "Só dá para remover jogadores antes do leilão começar.";
    const n = st.players.length;
    st.players = st.players.filter((p) => p.id !== id);
    if (st.players.length !== n) st.seq++;
    return null;
  }
  function setConnected(st, id, on) {
    const p = st.players.find((x) => x.id === id);
    if (p && p.connected !== on) { p.connected = on; st.seq++; }
  }
  /* ---------- doação na sala (sai do dinheiro inicial; guarda R$ 1 para jogar) ---------- */
  const donateLeft = (st, p) => Math.max(0, st.settings.money - (p.donated || 0) - 1);
  function donate(st, id, amount) {
    if (st.phase !== "lobby") return "Doações só valem na sala, antes do leilão começar.";
    const p = st.players.find((x) => x.id === id);
    if (!p) return "Só jogadores podem doar.";
    const v = Math.floor(+amount);
    if (!(v >= 1)) return "A doação mínima é R$ 1.";
    const left = donateLeft(st, p);
    if (v > left) return left > 0 ? `Você pode doar até R$ ${left} e ainda guardar R$ 1 para o leilão.` : "Você precisa guardar pelo menos R$ 1 para o leilão.";
    p.donated = (p.donated || 0) + v;
    st.seq++;
    return null;
  }
  function updateSettings(st, patch) {
    if (st.phase !== "lobby") return "As regras não mudam com o leilão em andamento.";
    st.settings = cleanSettings(patch, st.settings);
    st.seq++;
    return null;
  }

  /* ---------- missões secretas ---------- */
  function missionPool(st) {
    const s = st.settings, lots = st.lots, start = s.money;
    const genreCount = {};
    lots.forEach((f) => (f.g || []).filter((g) => g !== GROUP_TAG).forEach((g) => (genreCount[g] = (genreCount[g] || 0) + 1)));
    const pool = [];
    Object.entries(genreCount).filter(([, c]) => c >= 3).forEach(([g]) =>
      pool.push({ key: "genre:" + g, kind: "genre", genre: g, n: 2, pts: 5, text: `Tenha 2 filmes de ${g}` }));
    pool.push({ key: "saver", kind: "saver", min: Math.ceil(start * 0.4), pts: 4, text: `Termine com pelo menos R$ ${Math.ceil(start * 0.4)} sobrando` });
    pool.push({ key: "bargain", kind: "bargain", max: Math.max(1, Math.floor(start * 0.1)), pts: 3, text: `Arremate um filme por até R$ ${Math.max(1, Math.floor(start * 0.1))}` });
    pool.push({ key: "big", kind: "big", pts: 4, text: "Faça a compra mais cara do leilão" });
    if (lots.filter((f) => +f.year && +f.year < 1990).length >= 2) pool.push({ key: "old", kind: "old", pts: 3, text: "Tenha um filme lançado antes de 1990" });
    if (lots.filter((f) => +f.year >= 2015).length >= 2) pool.push({ key: "new", kind: "new", pts: 3, text: "Tenha um filme lançado de 2015 em diante" });
    if (lots.filter((f) => (f.r || 0) >= 8.5).length >= 2) pool.push({ key: "critic", kind: "critic", pts: 3, text: "Tenha um filme com nota 8,5 ou mais" });
    if (s.maxFilms <= lots.length && s.maxFilms >= 2) pool.push({ key: "full", kind: "full", pts: 4, text: `Complete seu limite de ${s.maxFilms} filmes` });
    if (s.maxFilms >= 2) pool.push({ key: "decade", kind: "decade", pts: 3, text: "Tenha 2 filmes da mesma década" });
    if (s.maxFilms >= 3) pool.push({ key: "variety", kind: "variety", pts: 4, text: "Tenha filmes de 3 gêneros principais diferentes" });
    return pool;
  }
  function checkMission(st, p, m) {
    const films = p.films;
    switch (m.kind) {
      case "genre": return films.filter((f) => (f.g || []).includes(m.genre)).length >= m.n;
      case "saver": return p.money >= m.min;
      case "bargain": return films.some((f) => f.paid <= m.max);
      case "big": {
        const top = Math.max(0, ...st.results.map((r) => r.price || 0));
        return top > 0 && films.some((f) => f.paid === top);
      }
      case "old": return films.some((f) => +f.year && +f.year < 1990);
      case "new": return films.some((f) => +f.year >= 2015);
      case "critic": return films.some((f) => (f.r || 0) >= 8.5);
      case "full": return films.length >= st.settings.maxFilms;
      case "decade": {
        const c = {}; films.forEach((f) => { const d = decade(f.year); if (d) c[d] = (c[d] || 0) + 1; });
        return Object.values(c).some((n) => n >= 2);
      }
      case "variety": return new Set(films.map(primaryGenre)).size >= 3;
    }
    return false;
  }

  /* ---------- início ---------- */
  function cleanFilm(f) {
    const str = (v, n) => String(v ?? "").slice(0, n);
    const img = typeof f.img === "string" && /^https:\/\/(upload\.wikimedia\.org|m\.media-amazon\.com)\//.test(f.img) ? f.img.slice(0, 600) : null;
    return {
      id: str(f.id, 24), title: str(f.title, 140) || "Sem título", orig: str(f.orig, 140), year: int(f.year, 0, 3000, 0) || "",
      dir: str(f.dir, 140), g: (Array.isArray(f.g) ? f.g : []).slice(0, 8).map((x) => str(x, 32)),
      r: Number.isFinite(+f.r) && f.r !== null && f.r !== "" ? Math.round(Math.max(0, Math.min(10, +f.r)) * 10) / 10 : null,
      rsrc: str(f.rsrc, 24), img, wiki: str(f.wiki, 200), by: str(f.by, 30)
    };
  }
  function start(st, lots, now, rng) {
    rng = rng || Math.random;
  st.clock = now;
    if (st.players.length < 2) return "O leilão precisa de pelo menos 2 jogadores.";
    if (!Array.isArray(lots) || !lots.length) return "Escolha pelo menos 1 filme para leiloar.";
    const seen = new Set();
    st.lots = lots.slice(0, 200).map(cleanFilm).filter((f) => f.id && !seen.has(f.id) && seen.add(f.id));
    if (!st.lots.length) return "Nenhum filme válido para leiloar.";
    const fm = st.settings.formats;
    st.lots.forEach((f, i) => (f.format = fm.length === 1 ? fm[0] : fm[Math.floor(rng() * fm.length)]));
    st.players.forEach((p) => { p.money = Math.max(1, st.settings.money - (p.donated || 0)); p.films = []; p.missions = []; });
    if (st.settings.missions) {
      const pool = missionPool(st);
      const order = shuffle(pool, rng);
      st.players.forEach((p, i) => { p.missions = [clone(order[i % order.length])]; });
    }
    st.phase = "playing"; st.idx = 0; st.results = []; st.log = []; st.starter = 0;
    startLot(st, now);
    st.seq++;
    return null;
  }

  const canPlay = (st, p) => p.money >= 1 && p.films.length < st.settings.maxFilms;
  const byId = (st, id) => st.players.find((p) => p.id === id);
  function log(st, entry) { entry.at = st.clock || 0; st.log.unshift(entry); if (st.log.length > 250) st.log.length = 250; }

  function startLot(st, now) {
    if (st.idx >= st.lots.length || !st.players.some((p) => canPlay(st, p))) return finish(st);
    const f = st.lots[st.idx], s = st.settings;
    const eligible = st.players.filter((p) => canPlay(st, p)).map((p) => p.id);
    const lot = { format: f.format, stage: "bid", eligible, startedAt: now };
    if (f.format === "classic") {
      Object.assign(lot, { high: 0, highBy: null, inLot: eligible.slice(), passed: [] });
      // quem abre gira a cada lote
      const n = st.players.length;
      let i = st.starter % n, k = 0;
      while (!eligible.includes(st.players[i].id) && k++ < n) i = (i + 1) % n;
      lot.turn = st.players[i].id;
      lot.deadline = s.turnSeconds ? now + s.turnSeconds * 1000 : null;
    } else if (f.format === "sealed") {
      Object.assign(lot, { bids: {}, deadline: s.sealedSeconds ? now + s.sealedSeconds * 1000 : null });
    } else {
      const top = Math.max(...eligible.map((id) => byId(st, id).money));
      Object.assign(lot, { price: top, startPrice: top, nextAt: now + s.dutchStepMs + 1200, step: s.dutchStepMs, floorHits: 0 });
    }
    st.lot = lot;
    log(st, { k: "lot", n: st.idx + 1, title: f.title, format: f.format });
    if (f.format === "classic") classicAutoSkip(st, now);
  }

  /* ---------- Aberto ---------- */
  function classicNext(st, now) {
    const lot = st.lot, ids = st.players.map((p) => p.id), n = ids.length;
    const cur = ids.indexOf(lot.turn);
    for (let k = 1; k <= n; k++) {
      const c = ids[(cur + k) % n];
      if (lot.inLot.includes(c) && c !== lot.highBy) {
        lot.turn = c;
        lot.deadline = st.settings.turnSeconds ? now + st.settings.turnSeconds * 1000 : null;
        return classicAutoSkip(st, now);
      }
    }
    closeLot(st, now);
  }
  function classicAutoSkip(st, now) {
    const lot = st.lot;
    if (!lot.inLot.length) return closeLot(st, now);
    if (lot.highBy && lot.inLot.every((i) => i === lot.highBy)) return closeLot(st, now);
    const p = byId(st, lot.turn);
    if (p.money <= lot.high) {
      lot.inLot = lot.inLot.filter((i) => i !== p.id);
      log(st, { k: "broke", p: p.id, v: lot.high });
      return classicNext(st, now);
    }
  }

  /* ---------- fechamento ---------- */
  function sell(st, pid, price, now, extra) {
    const f = st.lots[st.idx], p = byId(st, pid);
    p.money -= price;
    p.films.push(Object.assign({}, f, { paid: price, lot: st.idx + 1 }));
    st.results.push({ id: f.id, title: f.title, by: pid, price, format: f.format });
    st.lot.stage = "done";
    st.lot.result = Object.assign({ by: pid, price }, extra || {});
    log(st, { k: "sold", p: pid, v: price, title: f.title });
  }
  function unsold(st, now, extra) {
    const f = st.lots[st.idx];
    st.results.push({ id: f.id, title: f.title, by: null, price: 0, format: f.format });
    st.lot.stage = "done";
    st.lot.result = Object.assign({ by: null, price: 0 }, extra || {});
    log(st, { k: "unsold", title: f.title });
  }
  function afterClose(st, now) {
    st.lot.deadline = st.settings.autoNextSeconds ? now + st.settings.autoNextSeconds * 1000 : null;
  }
  function closeLot(st, now) {
    const lot = st.lot;
    if (lot.format === "classic") {
      if (lot.highBy) sell(st, lot.highBy, lot.high, now); else unsold(st, now);
    } else if (lot.format === "sealed") {
      const bids = Object.entries(lot.bids).filter(([, b]) => b.v > 0).map(([p, b]) => ({ p, v: b.v, t: b.t }));
      bids.sort((a, b) => b.v - a.v || a.t - b.t);
      const reveal = bids.map((b) => ({ p: b.p, v: b.v }));
      log(st, { k: "reveal", bids: reveal });
      if (bids.length) sell(st, bids[0].p, bids[0].v, now, { reveal, tie: bids[1] && bids[1].v === bids[0].v });
      else unsold(st, now, { reveal });
    } else {
      unsold(st, now);
    }
    afterClose(st, now);
  }

  /* ---------- ações ---------- */
  function act(st, pid, a, now) {
    if (st.phase !== "playing" || !st.lot) return "O leilão não está em andamento.";
    st.clock = now;
    const lot = st.lot, p = byId(st, pid);
    if (!p) return "Você não é um jogador desta sala.";
    if (lot.stage !== "bid") return "Este lote já foi fechado.";
    if (lot.format === "classic") {
      if (lot.turn !== pid) return "Ainda não é a sua vez.";
      if (a.type === "bid") {
        const v = Math.floor(+a.amount);
        if (!(v > lot.high)) return `O lance precisa ser maior que R$ ${lot.high}.`;
        if (v > p.money) return `Você só tem R$ ${p.money}.`;
        lot.high = v; lot.highBy = pid;
        log(st, { k: "bid", p: pid, v });
      } else if (a.type === "pass") {
        lot.inLot = lot.inLot.filter((i) => i !== pid); lot.passed.push(pid);
        log(st, { k: "pass", p: pid });
      } else return "Ação inválida neste formato.";
      classicNext(st, now);
    } else if (lot.format === "sealed") {
      if (a.type !== "sealed") return "Ação inválida neste formato.";
      if (!lot.eligible.includes(pid)) return "Você está aguardando o fim do leilão.";
      const v = Math.max(0, Math.floor(+a.amount || 0));
      if (v > p.money) return `Você só tem R$ ${p.money}.`;
      const first = !lot.bids[pid];
      lot.bids[pid] = { v, t: lot.bids[pid] && lot.bids[pid].v === v ? lot.bids[pid].t : now };
      if (first) log(st, { k: v ? "sealed" : "sealedPass", p: pid });
      if (lot.eligible.every((id) => lot.bids[id])) closeLot(st, now);
    } else {
      if (a.type !== "buy") return "Ação inválida neste formato.";
      if (!lot.eligible.includes(pid)) return "Você está aguardando o fim do leilão.";
      if (p.money < lot.price) return `O preço ainda está acima do seu saldo (R$ ${p.money}).`;
      sell(st, pid, lot.price, now, { dutch: true });
      afterClose(st, now);
    }
    st.seq++;
    return null;
  }
  function next(st, now) {
    if (st.phase !== "playing" || !st.lot || st.lot.stage !== "done") return "O lote atual ainda está em disputa.";
    st.clock = now;
    st.idx++; st.starter = (st.starter + 1) % st.players.length;
    startLot(st, now);
    st.seq++;
    return null;
  }
  function finish(st) {
    for (let i = st.idx; i < st.lots.length; i++) {
      const f = st.lots[i];
      if (!st.results.some((r) => r.id === f.id)) st.results.push({ id: f.id, title: f.title, by: null, price: 0, format: f.format, skipped: true });
    }
    if (st.idx < st.lots.length) log(st, { k: "nobody" });
    log(st, { k: "end" });
    st.phase = "over"; st.lot = null; st.seq++;
  }
  function backToLobby(st) {
    st.phase = "lobby"; st.lots = []; st.idx = 0; st.lot = null; st.results = []; st.log = [];
    st.players.forEach((p) => { p.money = 0; p.donated = 0; p.films = []; p.missions = []; });
    st.seq++;
  }

  /* ---------- tempo ---------- */
  function tick(st, now) {
    if (st.phase !== "playing" || !st.lot) return false;
    st.clock = now;
    const lot = st.lot, before = st.seq;
    if (lot.stage === "done") {
      if (lot.deadline && now >= lot.deadline) next(st, now);
    } else if (lot.format === "classic") {
      if (lot.deadline && now >= lot.deadline) {
        const pid = lot.turn;
        lot.inLot = lot.inLot.filter((i) => i !== pid); lot.passed.push(pid);
        log(st, { k: "timeout", p: pid });
        classicNext(st, now); st.seq++;
      }
    } else if (lot.format === "sealed") {
      if (lot.deadline && now >= lot.deadline) { closeLot(st, now); st.seq++; }
    } else {
      let guard = 0;
      while (lot.stage === "bid" && now >= lot.nextAt && guard++ < 50) {
        if (lot.price > 1) { lot.price--; lot.nextAt += lot.step; }
        else if (lot.floorHits < 2) { lot.floorHits++; lot.nextAt += lot.step; } // segura um pouco no R$ 1
        else { closeLot(st, now); }
        st.seq++;
      }
    }
    return st.seq !== before;
  }

  /* ---------- pontuação ---------- */
  function market(st) {
    const sold = [];
    st.players.forEach((p) => p.films.forEach((f) => sold.push({ g: primaryGenre(f), paid: f.paid })));
    const m = {};
    sold.forEach((x) => { m[x.g] = m[x.g] || { genre: x.g, count: 0, paid: 0 }; m[x.g].count++; m[x.g].paid += x.paid; });
    const rows = Object.values(m).sort((a, b) => b.count - a.count || b.paid - a.paid || a.genre.localeCompare(b.genre));
    rows.forEach((r, i) => (r.bonus = MARKET_BONUS[i] || 0));

  }
  function scores(st) {
    const mk = st.settings.market ? market(st) : [];
    const bonusOf = (g) => (mk.find((r) => r.genre === g) || {}).bonus || 0;
    const rows = st.players.map((p) => {
      const ratings = Math.round(p.films.reduce((a, f) => a + (f.r || 0), 0) * 10) / 10;
      const mkt = st.settings.market ? p.films.reduce((a, f) => a + bonusOf(primaryGenre(f)), 0) : 0;
      const missions = (p.missions || []).map((m) => Object.assign({}, m, { ok: checkMission(st, p, m) }));
      const mis = missions.reduce((a, m) => a + (m.ok ? m.pts : 0), 0);
      return { id: p.id, ratings, market: mkt, missions, missionPts: mis, total: Math.round((ratings + mkt + mis) * 10) / 10, money: p.money, spent: Math.max(1, st.settings.money - (p.donated || 0)) - p.money };
    });
    rows.sort((a, b) => b.total - a.total || b.money - a.money);
    return rows;
  }

  /* ---------- visão por jogador (esconde o que é secreto) ---------- */
  function view(st, viewerId) {
    const v = clone(st);
    const all = viewerId === "*";
    if (v.lot && v.lot.format === "sealed" && v.lot.stage === "bid") {
      const bids = v.lot.bids;
      v.lot.submitted = Object.keys(bids);
      v.lot.myBid = all ? null : (bids[viewerId] ? bids[viewerId].v : null);
      v.lot.bids = all ? bids : {};
    }
    if (v.phase !== "over" && !all) v.players.forEach((p) => { if (p.id !== viewerId) p.missions = p.missions.map(() => ({ hidden: true })); });
    if (v.phase !== "playing") delete v.lot;
    return v;
  }

  return { COLORS, GROUP_TAG, FORMATS, DEFAULTS, MAX_PLAYERS, MARKET_BONUS, create, addPlayer, removePlayer, setConnected, updateSettings, donate, donateLeft,
    start, act, next, tick, finish, backToLobby, scores, market, view, primaryGenre, canPlay, cleanSettings, missionPool };
});

<script>/* ============================================================
   Martelo Live — regras do Mercado (economia persistente)
   Roda igual no servidor e no navegador. A economia inteira é um objeto simples
   (serializável em JSON). O tempo entra sempre como parâmetro `now` (ms).
   Senhas e tokens nunca passam por aqui: o servidor entrega só o hash.
   Toda movimentação de dinheiro gera um lançamento no extrato (`ledger`).
   ============================================================ */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory(require("./market-config.js"));
  else root.Market = factory(root.MarketConfig);
})(typeof self !== "undefined" ? self : this, function (CONFIG) {
  "use strict";

  const DAY = 864e5, WEEK = 7 * DAY;
  const KINDS = { signup: "Boas-vindas", allowance: "Mesada semanal", fee: "Taxa", sale: "Venda", buyback: "Venda para a Casa", donate: "Donate", prize: "Prêmio", admin: "Ajuste do admin" };

  /* ---------- utilidades ---------- */
  const cleanName = (n) => String(n || "").replace(/\s+/g, " ").trim().slice(0, 18);
  const nameKey = (n) => cleanName(n).toLowerCase();
  const isAmount = (v) => Number.isInteger(v) && v >= 1;

  /* ---------- criação ---------- */
  function create() {
    return {
      v: 1,
      seq: 0,                  // muda a cada alteração
      nextId: 1,               // id dos lançamentos
      users: {},               // {id, name, nameKey, admin, createdAt, auth, wallet:{free, reserved}, nextAllowanceAt}
      sessions: {},            // hash do token -> {uid, createdAt, expiresAt}
      ledger: [],              // {id, at, uid, delta, kind, ref}
      films: {}, copies: {}, auctions: {}, house: {}   // próximas fases
    };
  }

  /* ---------- mesada: próximo ciclo depois de `now` ---------- */
  function nextCycle(now, cfg) {
    cfg = cfg || CONFIG;
    const off = cfg.tzOffsetMin * 60e3;
    const local = new Date(now + off); // campos UTC = relógio do fuso do ciclo
    const base = Date.UTC(local.getUTCFullYear(), local.getUTCMonth(), local.getUTCDate(), cfg.allowanceHour);
    let t = base + ((cfg.allowanceDay - local.getUTCDay() + 7) % 7) * DAY - off;
    if (t <= now) t += WEEK;
    return t;
  }

  /* ---------- contas ---------- */
  function findByName(eco, name) {
    const k = nameKey(name);
    return Object.values(eco.users).find((u) => u.nameKey === k) || null;
  }
  function checkName(eco, name, cfg) {
    cfg = cfg || CONFIG;
    if (!cfg.signupOpen) return "O cadastro está fechado no momento.";
    const n = cleanName(name);
    if (n.length < 2) return "O nome precisa de pelo menos 2 letras.";
    if (findByName(eco, n)) return "Já existe uma conta com esse nome.";
    return null;
  }
  function addUser(eco, u, now, cfg) {
    cfg = cfg || CONFIG;
    const err = checkName(eco, u.name, cfg);
    if (err) return err;
    if (!u.id || eco.users[u.id]) return "Não deu para criar a conta. Tente de novo.";
    const name = cleanName(u.name);
    eco.users[u.id] = { id: u.id, name, nameKey: nameKey(name), admin: !!u.admin, createdAt: now, auth: u.auth, wallet: { free: 0, reserved: 0 }, nextAllowanceAt: nextCycle(now, cfg) };
    if (cfg.signupBonus > 0) credit(eco, u.id, cfg.signupBonus, "signup", now);
    eco.seq++;
    return null;
  }
  function setAuth(eco, uid, auth) {
    const u = eco.users[uid];
    if (!u) return "Conta não encontrada.";
    u.auth = auth; eco.seq++;
    return null;
  }

  /* ---------- sessões (o servidor guarda só o hash do token) ---------- */
  function addSession(eco, hash, uid, now, cfg) {
    cfg = cfg || CONFIG;
    pruneSessions(eco, now);
    eco.sessions[hash] = { uid, createdAt: now, expiresAt: now + cfg.sessionDays * DAY };
    eco.seq++;
  }
  function sessionUser(eco, hash, now) {
    const s = eco.sessions[hash];
    return s && s.expiresAt > now && eco.users[s.uid] ? s.uid : null;
  }
  function revokeSession(eco, hash) { if (eco.sessions[hash]) { delete eco.sessions[hash]; eco.seq++; } }
  function revokeSessions(eco, uid, keepHash) {
    for (const [h, s] of Object.entries(eco.sessions)) if (s.uid === uid && h !== keepHash) delete eco.sessions[h];
    eco.seq++;
  }
  function pruneSessions(eco, now) { for (const [h, s] of Object.entries(eco.sessions)) if (s.expiresAt <= now) delete eco.sessions[h]; }

  /* ---------- carteira ---------- */
  function entry(eco, uid, delta, kind, now, ref) {
    eco.ledger.push({ id: eco.nextId++, at: now, uid, delta, kind, ref: ref || null });
  }
  function credit(eco, uid, amount, kind, now, ref) {
    const u = eco.users[uid];
    if (!u) return "Conta não encontrada.";
    if (!isAmount(amount)) return "Valor inválido.";
    u.wallet.free += amount;
    entry(eco, uid, amount, kind, now, ref); eco.seq++;
    return null;
  }
  function debit(eco, uid, amount, kind, now, ref) {
    const u = eco.users[uid];
    if (!u) return "Conta não encontrada.";
    if (!isAmount(amount)) return "Valor inválido.";
    if (amount > u.wallet.free) return `Saldo insuficiente: você tem R$ ${u.wallet.free} livres.`;
    u.wallet.free -= amount;
    entry(eco, uid, -amount, kind, now, ref); eco.seq++;
    return null;
  }
  // reserva: o dinheiro continua seu, mas fica preso (lance vencedor de um leilão)
  function reserve(eco, uid, amount) {
    const u = eco.users[uid];
    if (!u) return "Conta não encontrada.";
    if (!isAmount(amount)) return "Valor inválido.";
    if (amount > u.wallet.free) return `Saldo insuficiente: você tem R$ ${u.wallet.free} livres.`;
    u.wallet.free -= amount; u.wallet.reserved += amount; eco.seq++;
    return null;
  }
  function release(eco, uid, amount) {
    const u = eco.users[uid];
    if (!u) return "Conta não encontrada.";
    if (!isAmount(amount) || amount > u.wallet.reserved) return "Valor reservado inválido.";
    u.wallet.reserved -= amount; u.wallet.free += amount; eco.seq++;
    return null;
  }
  // paga com o dinheiro que estava reservado
  function capture(eco, uid, amount, kind, now, ref) {
    const u = eco.users[uid];
    if (!u) return "Conta não encontrada.";
    if (!isAmount(amount) || amount > u.wallet.reserved) return "Valor reservado inválido.";
    u.wallet.reserved -= amount;
    entry(eco, uid, -amount, kind, now, ref); eco.seq++;
    return null;
  }

  /* ---------- tempo: mesada semanal ---------- */
  // Idempotente: paga só quem chegou no ciclo e já reagenda. Devolve quem recebeu.
  function tick(eco, now, cfg) {
    cfg = cfg || CONFIG;
    const paid = [];
    for (const u of Object.values(eco.users)) {
      if (now < u.nextAllowanceAt) continue;
      const missed = 1 + Math.floor((now - u.nextAllowanceAt) / WEEK);
      u.nextAllowanceAt += missed * WEEK;
      const weeks = Math.min(missed, Math.max(1, cfg.allowanceCatchUp));
      if (cfg.allowance > 0) { credit(eco, u.id, cfg.allowance * weeks, "allowance", now, weeks > 1 ? `${weeks} semanas` : null); paid.push(u.id); }
      eco.seq++;
    }
    return paid;
  }

  /* ---------- leitura ---------- */
  const supply = (eco) => Object.values(eco.users).reduce((a, u) => a + u.wallet.free + u.wallet.reserved, 0);
  function view(eco, uid) {
    const u = eco.users[uid];
    if (!u) return null;
    return { id: u.id, name: u.name, admin: u.admin, createdAt: u.createdAt, wallet: Object.assign({}, u.wallet), nextAllowanceAt: u.nextAllowanceAt };
  }
  function ledgerOf(eco, uid, n) {
    const out = [];
    for (let i = eco.ledger.length - 1; i >= 0 && out.length < (n || CONFIG.ledgerView); i--) if (eco.ledger[i].uid === uid) out.push(eco.ledger[i]);
    return out;
  }
  const balanceFromLedger = (eco, uid) => eco.ledger.reduce((a, e) => a + (e.uid === uid ? e.delta : 0), 0);

  return { CONFIG, KINDS, WEEK, cleanName, nameKey, create, nextCycle, findByName, checkName, addUser, setAuth,
    addSession, sessionUser, revokeSession, revokeSessions, pruneSessions,
    credit, debit, reserve, release, capture, tick, supply, view, ledgerOf, balanceFromLedger };
});
</script>

 ["tt0317248","Cidade de Deus","Cidade de Deus",2002,"Fernando Meirelles","Nacional|Crime|Drama",8.6,"City of God (2002 film)"],
 ["tt0861739","Tropa de Elite","Tropa de Elite",2007,"José Padilha","Nacional|Ação|Crime",8.0,"Elite Squad"],
 ["tt0271383","O Auto da Compadecida","O Auto da Compadecida",2000,"Guel Arraes","Nacional|Comédia|Fantasia",8.5,"A Dog's Will"],
 ["tt0140888","Central do Brasil","Central do Brasil",1998,"Walter Salles","Nacional|Drama",8.0,"Central Station (film)"],
 ["tt2762506","Bacurau","Bacurau",2019,"Kleber Mendonça Filho e Juliano Dornelles","Nacional|Suspense|Ação",7.3,"Bacurau"],
 ["tt3742378","Que Horas Ela Volta?","Que Horas Ela Volta?",2015,"Anna Muylaert","Nacional|Drama|Comédia",7.7,"The Second Mother (2015 film)"]
];
const BASE = RAW.map(([id, title, orig, year, dir, g, r, wiki, by]) => ({ id, title, orig, year, dir, g: g.split("|").concat(by ? [GROUP_TAG] : []), r, rsrc: "IMDb", wiki, by }));

const WD = "https://query.wikidata.org/sparql";
const IMDB = "https://api.imdbapi.dev";
const TIERS = {
  alta: { label: "Famosos", desc: "Blockbusters e clássicos", min: 70 },
  media: { label: "Conhecidos", desc: "Equilíbrio entre fama e surpresa", min: 40 },

};
const CATS = [
  { name: "Ficção científica", q: "Q471839" }, { name: "Terror", q: "Q200092" }, { name: "Suspense", q: "Q2484376" },
  { name: "Ação", q: "Q188473" }, { name: "Comédia", q: "Q157443" }, { name: "Drama", q: "Q130232" },
